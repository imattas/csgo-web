<script>
/* SET THE PANORAMA UI SCALE BEFORE FIRST PAINT.
   ui/cs2_teamcounter.css sizes the whole top row in Valve's 1080p-reference
   px and scales it with `zoom: var(--cs2-ui-scale)`. That variable used to be
   written by the HUD's first updateAvatars(), which does not run until a match
   starts -- so every frame before that used the fallback of 1 and drew the row
   at full 1920px scale before snapping down. Setting it here, inline and ahead
   of the stylesheet's first use, means the row is never once drawn at the
   wrong size. Kept in sync on resize for the same reason. */
(function () {
  var set = function () {
    var hudScale = (window.__csgoWebSettings && window.__csgoWebSettings.hud && window.__csgoWebSettings.hud.scale) || 1;
    document.documentElement.style.setProperty('--cs2-ui-scale', (window.innerHeight / 1080) * hudScale);
  };
  set();
  addEventListener('resize', set);
})();
</script>
<!-- THE TOP HUD MUST BE COMPLETE ON ITS FIRST FRAME. Without these the row
     assembles in stages: the timer paints in a fallback face and reflows when
     Stratum arrives, and each avatar / mask / bomb icon pops in as its first
     use triggers the fetch. Preloading the handful the row actually needs on
     frame one costs ~90KB and removes the whole staggered load-in. -->

<style>
  :root {
    --accent: #8bc53f;          /* CS2 play-button green */
    --accent-dim: rgba(139,197,63,0.16);
    --money: #a7c46a;
    --ct: #7db8f0;
    --t: #eabe54;
    --panel: rgba(13,16,20,0.72);
    --panel-solid: rgba(15,18,22,0.94);
    --danger: #e64b3c;
    --hud-font: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
    --num-font: 'Arial Narrow', 'Segoe UI', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0f13;
    font-family: var(--hud-font); }
  #game canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #e8eef2; z-index: 10; }
  #hud > * { pointer-events: none; }
  /* Chromebook mode keeps the HUD compositor cheap; the game renderer is
     already running without postfx, so a second blur layer only adds delay. */
  .csgo-web-lowend #hud .hud-HA-center,
  .csgo-web-lowend #scorebar .equipinfo--score-time__bg,
  .csgo-web-lowend #inspectov .in-ref,
  .csgo-web-lowend #caseopen .in-ref { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }

  /* crosshair */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #hud.inmenu #crosshair, #hud.inmenu #fps, #hud.inmenu #sitebadge, #hud.inmenu #tcrow,
  #hud.inmenu #statl, #hud.inmenu #statr, #hud.inmenu #money { display: none; }
  #hud.inmenu #crosshair { display: none !important; }
  /* TEAM SELECT HIDES WHAT THE MENU HIDES. There are two non-playing states and
     each rule had to name both; several named only `.inmenu`, so the loading and
     team-select screens kept a live HUD behind the cards -- the BUY prompt, the
     money, the stat panels, the fps counter. Anything the menu hides, the cards
     hide. (crosshair / tcrow / radar / cs2bottom / cs2weapons / casebtn already
     list both, further down.) */
  #hud.teamselect #fps, #hud.teamselect #sitebadge, #hud.teamselect #statl,
  #hud.teamselect #statr, #hud.teamselect #money { display: none; }
  .case-odds { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; margin: 4px 0 2px;
    font-size: 9.5px; letter-spacing: 0.2px; opacity: 0.9; }
  .case-odds .odd { color: var(--oc); }
  .co-odds { font-size: 11px; letter-spacing: 0.4px; margin-top: 5px; font-weight: 500; opacity: 0.85; }
  .setsub { font-size: 12px; letter-spacing: 2px; opacity: 0.6; margin: 18px 0 8px; text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 5px; }
  .bindrow { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13px; }
  .bindrow span { opacity: 0.8; }
  .bindkey { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #e8edf2;
    min-width: 92px; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
    letter-spacing: 1px; font-family: var(--num-font); }
  .bindkey:hover { background: rgba(255,255,255,0.16); }
  .bindkey.waiting { border-color: var(--accent); color: var(--accent); }
  #menu.pausemode #tab-play, #menu.pausemode #tabs [data-tab="play"],
  #menu.pausemode #tab-loadout, #menu.pausemode #tabs [data-tab="loadout"],   /* no re-kitting mid-match (user's call) */
  #menu.pausemode #tab-trading, #menu.pausemode #tabs [data-tab="trading"],
  #menu.pausemode #tab-market, #menu.pausemode #tabs [data-tab="market"] { display: none !important; }
  /* TRADING and MARKETPLACE (home menu only, see above): placeholder pages until the
     features exist. Seven tabs is tight, so the nav steps down with the window.
     Measured: the player name's rank chip wraps once a side block drops below ~180 px,
     so MARKETPLACE (~1237 px needed) reads MARKET below 1260, tab side padding drops
     to 7 px below 1200, and to 5 px with 12 px text at 1079 and below -- which is also
     what fits a phone (844 wide). The padding rules carry two ids on purpose: they
     sit ABOVE the base `#tabs button` rules, which would win a tie. */
  #tabs [data-tab="market"]::after { content: 'MARKETPLACE'; }
  @media (max-width: 1259px) { #tabs [data-tab="market"]::after { content: 'MARKET'; } }
  @media (min-width: 1080px) and (max-width: 1199px) { #navcenter #tabs button { padding-left: 7px; padding-right: 7px; } }
  @media (max-width: 1079px) { #navcenter #tabs button { padding-left: 5px; padding-right: 5px; font-size: 12px; } }
  .soonpage { max-width: 520px; margin: 60px auto 0; padding: 40px 30px; text-align: center;
    background: rgba(10,13,16,0.8); border-radius: 8px; border: 1px solid rgba(255,255,255,0.07); }
  .soonpage .ms-soon { font-size: 34px; font-weight: 900; letter-spacing: 6px; color: var(--accent); }
  .soonpage p { margin: 14px 0 0; font-size: 14px; line-height: 1.6; opacity: 0.75; }
  .st-view { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(10,13,16,0.75); color: #cfd8e0;
    cursor: pointer; font-size: 11px; line-height: 1; padding: 0; opacity: 0; transition: opacity 0.12s;
    z-index: 2; }
  .skintile:hover .st-view { opacity: 1; }
  .st-view:hover { background: rgba(255,255,255,0.18); }
  /* No vignette, no glow: CS2's background sheet (main.js loadInspectScene,
     the grey version) sits behind the item edge to edge, with the header
     and the button row over it. */
  #inspectov { position: fixed; inset: 0; z-index: 70; background: transparent; }
  #inspectov .mbtn { width: auto; display: inline-block; }
  /* CS2'S OWN PICTURE OF THE ITEM, as a reference to hold the 3D view against.
     It sits in a corner panel and is LABELLED, because the last time this
     render shared the card with the model the two read as two of the same gun
     and every "the skin is wrong" report was really about comparing them. */
  #inspectov .in-ref, #caseopen .in-ref { position: absolute; right: 22px; top: 20px; width: min(26vw, 300px);
    background: rgba(10,13,17,0.72); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 6px; padding: 8px 8px 6px; backdrop-filter: blur(3px); }
  #inspectov .in-ref img, #caseopen .in-ref img { display: block; width: 100%; height: auto; }
  #inspectov .in-ref-cap, #caseopen .in-ref-cap { font-size: 10px; letter-spacing: 1.6px; opacity: 0.55;
    text-align: center; margin-top: 4px; }
  #inspectov .in-ref.hide, #caseopen .in-ref.hide { display: none; }
  @media (max-width: 900px) { #inspectov .in-ref, #caseopen .in-ref { width: 34vw; right: 10px; top: 10px; } }
  #pause-back { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 60;
    background: var(--accent, #8bc53f); color: #10151a; border: 0; padding: 12px 26px; border-radius: 5px;
    font-weight: 800; letter-spacing: 2px; font-size: 13px; cursor: pointer; display: none;
    box-shadow: 0 6px 22px rgba(0,0,0,0.5); }
  #pause-back:hover { filter: brightness(1.1); }
  #tabs button { white-space: nowrap; }
  /* DEFAULT MARKER. Every option row marks the value the game ships with, so
     "what was this before I touched it" is answerable without a reset. A dot,
     not a word -- these rows are three-to-a-line on a phone. */
  .qrow button.isdef::after { content: '\2022'; position: absolute; top: 1px; right: 3px;
    font-size: 9px; line-height: 1; opacity: 0.45; pointer-events: none; }
  .qrow button { position: relative; }
  .qrow button.isdef.sel::after { opacity: 0.75; }
  /* AUTO, beside GRAPHICS: shown while the game is choosing the preset for this
     device (src/autoperf.js). A label, not a control -- picking an option is how
     you take over, RESET TO DEFAULTS is how you hand it back. */
  .autotag { display: inline-block; margin-left: 6px; padding: 1px 5px; font-size: 9px; letter-spacing: 1px;
    vertical-align: middle; color: var(--accent); border: 1px solid var(--accent); border-radius: 2px; opacity: 0.85; }
  /* "HARDWARE ACCELERATION IS OFF" (hud.js showHwNotice): the browser is drawing
     the game on the CPU, which no graphics setting can rescue -- say so, and
     say where the switch is. Over the menu, dismissible, never during a match. */
  #hwnotice { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 40;
    width: min(680px, calc(100% - 32px)); box-sizing: border-box; padding: 12px 40px 12px 14px;
    background: rgba(24,14,10,0.94); border: 1px solid #e0a040; border-radius: 3px;
    color: #f1e6d4; font-size: 13px; line-height: 1.45; text-align: left; }
  #hwnotice b { display: block; margin-bottom: 4px; color: #ffc15a; font-size: 12px; letter-spacing: 1.5px; }
  #hwnotice button { position: absolute; top: 6px; right: 8px; width: 26px; height: 26px; padding: 0; cursor: pointer;
    background: transparent; color: #f1e6d4; border: 1px solid rgba(255,255,255,0.25); border-radius: 2px;
    font-size: 14px; line-height: 1; }
  #hwnotice button:hover { background: rgba(255,255,255,0.14); }
  #menu.pausemode #hwnotice { display: none; }      /* the menu doubles as the in-match settings */
  /* CS2 classic static (esports default): thickness 2 / length 6 / gap 3,
     hard 1px black outline, no dynamic wobble — the exact screen center is
     the bullet ray, so the cross stays glued to it */
  .chline { position: absolute; background: var(--csgo-crosshair-color, #3cff5a); outline: 1px solid rgba(0,0,0,0.85); }
  .ch-n { left: calc(var(--csgo-crosshair-thickness, 2px) / -2); top: calc((var(--csgo-crosshair-gap, 3px) + var(--csgo-crosshair-length, 6px)) * -1); width: var(--csgo-crosshair-thickness, 2px); height: var(--csgo-crosshair-length, 6px); }
  .ch-s { left: calc(var(--csgo-crosshair-thickness, 2px) / -2); top: var(--csgo-crosshair-gap, 3px); width: var(--csgo-crosshair-thickness, 2px); height: var(--csgo-crosshair-length, 6px); }
  .ch-w { left: calc((var(--csgo-crosshair-gap, 3px) + var(--csgo-crosshair-length, 6px)) * -1); top: calc(var(--csgo-crosshair-thickness, 2px) / -2); width: var(--csgo-crosshair-length, 6px); height: var(--csgo-crosshair-thickness, 2px); }
  .ch-e { left: var(--csgo-crosshair-gap, 3px); top: calc(var(--csgo-crosshair-thickness, 2px) / -2); width: var(--csgo-crosshair-length, 6px); height: var(--csgo-crosshair-thickness, 2px); }
  #crosshair.csgo-web-crosshair-dot::after { content: ''; position: absolute; left: calc(var(--csgo-crosshair-thickness, 2px) / -2); top: calc(var(--csgo-crosshair-thickness, 2px) / -2); width: var(--csgo-crosshair-thickness, 2px); height: var(--csgo-crosshair-thickness, 2px); background: var(--csgo-crosshair-color, #3cff5a); outline: 1px solid rgba(0,0,0,.85); }
  /* OUTER crosshair: the cone the bullet can actually land in. Four dashes
     that ride out from the centre with the live inaccuracy, so standing still
     collapses them onto the inner cross and moving/jumping pushes them wide.
     Same green, thinner, so the inner mark still reads as "where I am aiming"
     and the outer one as "where it might go". */
  .chout { position: absolute; background: #3cff5a; outline: 1px solid rgba(0,0,0,0.7);
           opacity: 0.85; will-change: transform; }
  .cho-n, .cho-s { left: -1px; top: -1px; width: 2px; height: 7px; }
  .cho-w, .cho-e { left: -1px; top: -1px; width: 7px; height: 2px; }
  #crosshair.nofollow .chline, #crosshair.nofollow .chout { }

  /* hitmarker */
  /* The hitmarker rides the CROSSHAIR, not the screen centre. With
     crosshair-follows-shots on, the mark can be 200px up the screen mid-spray,
     and a hit flash pinned to the centre would flash somewhere the player is
     not looking. The offset goes on a WRAPPER because #hitmark's own transform
     is owned by the hmpop scale animation. */
  #hitmarkwrap { position: absolute; left: 50%; top: 50%; will-change: transform; }
  #hitmark { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 0.08s; }
  #hitmark.pop { animation: hmpop 0.14s ease-out; }
  @keyframes hmpop { 0% { transform: scale(1.55); } 100% { transform: scale(1); } }
  /* death: red vignette + killer card */
  #deathov { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.35s;
    background: radial-gradient(circle at 50% 50%, rgba(120,10,8,0.25) 0%, rgba(90,6,5,0.55) 70%, rgba(60,3,3,0.75) 100%); }
  #killcard { position: absolute; top: -120px; left: 50%; transform: translateX(-50%); transition: top 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    background: linear-gradient(180deg, rgba(14,17,21,0.96), rgba(10,12,15,0.96)); border: 1px solid rgba(255,255,255,0.14);
    border-top: 3px solid #e05a4e; border-radius: 0 0 8px 8px; padding: 12px 26px 14px; text-align: center; z-index: 30;
    box-shadow: 0 10px 34px rgba(0,0,0,0.6); }
  #killcard.show { top: 0; }
  #killcard .kc-label { font-size: 10px; letter-spacing: 3px; opacity: 0.55; margin-bottom: 5px; }
  #killcard .kc-name { font-size: 19px; font-weight: 800; letter-spacing: 1px; }
  #killcard .kc-wep { display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 7px; }
  #killcard .kc-wep img { width: 72px; height: 27px; object-fit: contain; }
  #killcard .kc-wname { font-size: 12.5px; opacity: 0.85; }
  #killcard .kc-skin { font-size: 11px; color: #8bb4e8; letter-spacing: 0.4px; }
  /* directional damage arcs (4-slot, rotated to the attacker bearing) */
  .dmgarc { position: absolute; left: 50%; top: 50%; width: 130px; height: 130px; margin: -65px 0 0 -65px;
    pointer-events: none; border-radius: 50%; border: 5px solid transparent; border-top-color: rgba(224, 52, 44, 0.9);
    opacity: 0; }
  #targetid { position: absolute; left: 50%; top: calc(50% + 28px); transform: translateX(-50%);
    font-size: 13px; font-weight: 600; letter-spacing: 0.6px; opacity: 0; transition: opacity 0.12s;
    text-shadow: 0 1px 4px rgba(0,0,0,0.95); pointer-events: none; }
  #smokeov { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.14s;
    background: radial-gradient(circle at 50% 50%, rgba(205,208,210,0.99) 0%, rgba(185,188,190,0.97) 60%, rgba(165,168,170,0.95) 100%); }
  .hm { position: absolute; width: 8px; height: 2px; background: #fff; box-shadow: 0 0 2px #000; }
  #hitmark.hs .hm { background: #ff4040; }
  .hm0 { transform: translate(-13px,-9px) rotate(45deg); }
  .hm1 { transform: translate(5px,-9px) rotate(-45deg); }
  .hm2 { transform: translate(-13px,7px) rotate(-45deg); }
  .hm3 { transform: translate(5px,7px) rotate(45deg); }

  /* status — CS2-style dark backing panels, condensed digits */
  #statl { position: absolute; left: 16px; bottom: 14px; display: flex; gap: 16px; align-items: baseline;
    background: linear-gradient(180deg, rgba(10,13,16,0.0), rgba(10,13,16,0.55)); padding: 6px 16px 8px;
    border-radius: 4px; }
  #hp { font-size: 38px; font-weight: 700; font-family: var(--num-font); letter-spacing: 0.5px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
  #hp.low { color: var(--danger); }
  /* health/ammo/weapon tinted by the player's team */
  #hud.team-ct #hp, #hud.team-ct #ammo, #hud.team-ct #wname { color: var(--ct); }
  #hud.team-t #hp, #hud.team-t #ammo, #hud.team-t #wname { color: var(--t); }
  #hud.team-ct #hp.low, #hud.team-t #hp.low { color: var(--danger); }

  /* in-game team selection (CS2-style) */
  #teamsel { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px; pointer-events: auto !important;
    background: radial-gradient(ellipse at center, rgba(8,10,13,0.45) 0%, rgba(8,10,13,0.85) 100%); }
  #hud.teamselect #crosshair, #hud.teamselect #tcrow, #hud.inmenu #tcrow { display: none !important; }
  #hud.teamselect #radar, #hud.inmenu #radar { display: none !important; }

  /* CS2 RADAR -- geometry straight out of panorama/styles/hud/hudradar.vcss:
       @define Radar_PanelSize      300px    the panel the dial sits in
       @define Radar_VisSize_Round  250px    the visible dial
       @define Radar_Overlay_Round  248px    its border ring
       #Radar { x: 0px; y: 40px; }           the panel's offset from the corner
     The dial is centred in the panel, so its top-left is 25px in and 40+25px
     down at Valve's 1080p reference. --cs2-ui-scale is the same factor the top
     strip and scoreboard use, which is what the engine does with screen height. */
  #radar { position: absolute; display: none; border-radius: 50%;
    /* --rd-inset is the gap from the screen corner, at Valve's 1080p reference
       so it scales with everything else. One value drives both axes, which is
       what keeps it reading as tucked into the corner rather than floating. */
    --rd-inset: 14px;
    left: calc(var(--rd-inset) * var(--cs2-ui-scale, 1));
    top: calc(var(--rd-inset) * var(--cs2-ui-scale, 1));
    width: calc(250px * var(--cs2-ui-scale, 1));
    height: calc(250px * var(--cs2-ui-scale, 1));
    transform: scale(var(--cs2-radar-scale, 1)); transform-origin: top left;
    /* #Radar__Round--Inner: background-color hud-blur-bg-color (#000000a0 in
       csgostyles) plus world-blur. The dial is painted HERE rather than in the
       canvas so the blur can reach the world behind it, which is what
       world-blur does and what a canvas fill cannot.

       THE RING IS NOT WHITE. .Radar__Round--BorderClass reads `border-color:
       white`, but the panel carrying it is
           <Panel id="Radar__Round--Border" class="hud-colorize-wash ..." />
       and hud-colorize-wash repaints it -- at CS2's default HUD colour that is
       the team tint, so the ring never renders as the bright white the rule
       alone suggests. Reading the border-color literally and ignoring the wash
       is what put a hard white ring on the dial.

       TOP OFFSET is ours, not Valve's: #Radar sets `y: 40px`, which with the
       dial's 25px inset lands it at 65. Moved up to sit where the reference
       capture has it. */
    background: #000000a0;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    border: 1px solid #4a4f55; }

  /* 3D skin reveal: the same sheet behind it, nothing over it */
  #caseopen.reveal3d { background: transparent !important; -webkit-backdrop-filter: none; backdrop-filter: none; }
  #caseopen.reveal3d #co-open, #caseopen.reveal3d #co-title { visibility: hidden; }
  #menu.rv3dmode #discordcard,
  #menu.rv3dmode #tab-cases, #menu.rv3dmode #tab-locker, #menu.rv3dmode #topnav, #menu.rv3dmode #menufoot,
  #menu.rv3dmode #pause-back,                          /* the pause screen's BACK TO GAME sat on the reveal's button row */
  #menu.casemode #pause-back,                          /* ...and on the wallet line through the unlock beat and the spin */
  #menu.rv3dmode #tab-play { visibility: hidden; }   /* play tab too: its "Player" title bled through the reveal */
  /* name + rarity crown the reveal from the TOP — weapon owns mid-screen,
     wallet/buttons live at the bottom edge (CS2 reveal framing) */
  #revealcard.rv3d { position: absolute; left: 0; right: 0; top: 0; bottom: auto; background: none !important;
    border: none !important; box-shadow: none !important; padding: 0; gap: 0; }
  .rv-hint { font-size: 11.5px; letter-spacing: 1.5px; opacity: 0.55; margin-top: 6px; }

  /* CS2'S INSPECT CHROME, converted from panorama/styles/popups/
     popup_capability_shared.vcss + popup_inventory_inspect.vcss (layouts
     popup_inspect_header.vxml, popup_inspect_action-bar.vxml). The header:
     the set image 128 px tall beside the name (50 px Stratum2 Medium) and
     its line under it (fontSize-l, 24 px) -- here the CASE the item came
     from, image and name, by the user's choice, not the collection -- then
     the rarity bar: 6 px, white -> #b9b9b9 washed by the rarity colour, a
     1px 1px 6px shadow, 8 px above and below, as wide as the header block.
     The button row at the foot: 968 px wide, a 1 px rgba(145,145,145,.5)
     rule on top, 8 px padding, icon buttons (28 px, washed white) at the
     left and the text buttons (PopupButton: 24 px condensed uppercase,
     10/12/8 px margins, a faint hover) at the right. Our own lines -- the
     rarity, condition, pattern and float, the drag hint, the wallet -- ride
     in the same block. 1080p px scaled by the screen (--u), like the reel. */
  #inspectov { --u: calc(100vh / 1080 / var(--ms, 1)); }
  .cs2ins-top { position: absolute; left: 0; right: 0; top: 0; padding-top: calc(48 * var(--u));
    display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 3; }
  .cs2ins-block { display: inline-flex; flex-direction: column; align-items: stretch; max-width: 92vw; }
  .cs2ins-head { display: flex; align-items: center; justify-content: center; }
  .cs2ins-set { height: calc(128 * var(--u)); width: auto; padding-right: calc(8 * var(--u)); flex: 0 0 auto; }
  .cs2ins-text { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .cs2ins-name { font-family: 'Stratum2 Medium', 'Stratum2', Arial, sans-serif; font-weight: 500;
    font-size: calc(50 * var(--u)); line-height: 1.0; color: #fff; max-width: min(calc(640 * var(--u)), 62vw);
    text-shadow: 0 0 0 #535353; }
  .cs2ins-sub { font-family: 'Stratum2', Arial, sans-serif; font-size: calc(24 * var(--u)); color: #fff; opacity: 0.92;
    margin-top: calc(2 * var(--u)); }
  .cs2ins-meta { font-size: calc(18 * var(--u)); opacity: 0.8; margin-top: calc(6 * var(--u)); letter-spacing: 0.3px; }
  .cs2ins-bar { height: calc(6 * var(--u)); margin: calc(8 * var(--u)) 0;
    background: linear-gradient(to right, var(--rc), color-mix(in srgb, var(--rc) 72.5%, #000));
    box-shadow: 1px 1px 6px 0 rgba(0,0,0,0.31); }
  .cs2ins-hint { font-size: calc(13 * var(--u)); letter-spacing: 1.5px; opacity: 0.55; text-align: center; }
  /* CS2's own mouse glyph (icons/ui/mouse_left.vsvg) in place of the mouse emoji */
  .cs2ins-mouse { height: calc(16 * var(--u)); width: auto; vertical-align: -3px; margin-right: 6px; }
  .cs2ins-bottom { position: absolute; left: 50%; bottom: calc(8 * var(--u)); translate: -50% 0; z-index: 4;
    width: min(calc(968 * var(--u)), 96vw); border-top: 1px solid rgba(145,145,145,0.5);
    padding: calc(8 * var(--u)) 0; display: flex; flex-wrap: nowrap; align-items: center; gap: calc(8 * var(--u)); margin: 0; }
  .cs2ins-btns { display: flex; align-items: center; margin-left: auto; }
  .cs2ins-bottom .mbtn, .cs2ins-bottom #co-equip, .cs2ins-bottom #co-again, .cs2ins-bottom #co-close { width: auto; min-width: 0; flex: 0 0 auto; margin: calc(4 * var(--u));
    padding: calc(10 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u)); border: 0; border-radius: 3px; color: #fff;
    background: linear-gradient(to left, rgba(0,0,0,0), rgba(0,0,0,0) 50%, rgba(0,0,0,0.06)); box-shadow: none;
    font-family: 'Stratum2 Medium', 'Stratum2', Arial, sans-serif; font-weight: 500; font-stretch: condensed;
    font-size: calc(24 * var(--u)); text-transform: uppercase; letter-spacing: 0; white-space: nowrap; transition: background-color 0.2s; }
  .cs2ins-bottom .mbtn:hover, .cs2ins-bottom #co-close:hover { background-color: rgba(255,255,255,0.05); filter: none; }
  .cs2ins-bottom #co-again:disabled { opacity: 0.4; }
  /* OPEN AGAIN is CS2's .PopupButton.Positive: positiveColor #0F9D58, brightness 1.4 on hover
     (after the shared rule above, which would otherwise win the background) */
  .cs2ins-bottom #co-again { background: #0F9D58; }
  .cs2ins-bottom #co-again:hover:not(:disabled) { background: #0F9D58; filter: brightness(1.4); }
  .cs2ins-bottom #co-equip:disabled { opacity: 0.55; }
  .cs2ins-bottom #co-wallet { position: static; transform: none; margin: 0 auto 0 calc(8 * var(--u)); font-size: calc(16 * var(--u));
    white-space: nowrap; flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }   /* gives way first: the buttons never wrap */
  .cs2ins-bottom #co-wallet b { font-size: calc(18 * var(--u)); }

  /* The player strip is styled entirely by ui/cs2_teamcounter.css, which is
     Valve's own hudteamcounter.vcss converted to browser CSS. Only the two
     positioning rules that place the strips relative to OUR score bar live
     here -- CS2's own sheet cannot know where that is. */
  /* The row itself is Valve's (#TeamCounterBG > #TeamCounter > containers),
     styled by the converted sheet. This only pins the row to the top of OUR
     screen and lets the scaled 1920px row centre in whatever width we have. */
  #tcrow { position: absolute; top: 10px; left: 0; right: 0; display: flex;
    justify-content: center; pointer-events: none; }
  #tcrow .cs2tc { flex: none; }
  #avct, #avt { display: flex; }
  /* THE ONE PIECE VALVE'S STYLESHEET DOES NOT CARRY. CS2 keeps the card badges
     in a `#Invisible` panel (visibility: collapse) and hudteamcounter.vts moves
     them onto the portrait at runtime. We have the sheet but not the script, so
     the overlay placement is ours -- the badges' own sizes, colours and shadows
     still come from Valve's rules, only `position` does not. */
  #avct .AavatarVisibleContainer, #avt .AavatarVisibleContainer { position: relative; }
  #avct .AavatarVisibleContainer > .AvatarL__C4,
  #avt  .AavatarVisibleContainer > .AvatarL__C4,
  #avct .AavatarVisibleContainer > .AvatarL__DefuseKit,
  #avt  .AavatarVisibleContainer > .AvatarL__DefuseKit { position: absolute; right: 1px; bottom: 1px; }
  #avct .AavatarVisibleContainer > .AvatarL__PlayerNumber,
  #avt  .AavatarVisibleContainer > .AvatarL__PlayerNumber { position: absolute; top: 0; right: 2px; }
  #avct .AavatarVisibleContainer > .AvatarL__Skull,
  #avt  .AavatarVisibleContainer > .AvatarL__Skull,
  #avct .AavatarVisibleContainer > .AvatarL__Bot,
  #avt  .AavatarVisibleContainer > .AvatarL__Bot { position: absolute; inset: 0; margin: auto; }
  /* CS2's layout sets scaling="stretch-to-fit-preserve-aspect" on every one of
     these <Image>s. That is an ATTRIBUTE, not CSS, so the converter never sees
     it -- without it the SVGs are squashed to whatever box they land in. */
  #avct .AavatarVisibleContainer img, #avt .AavatarVisibleContainer img { object-fit: contain; }
  /* THE PORTRAIT IS SQUARE, FULL STOP. CS2's image panel is 54 wide x 62 tall
     (AvatarLImageHeight) inside a 54x54 square that clips it, and its avatar
     fills that panel -- so Valve stretches a square Steam avatar 15% tall and
     then crops the bottom off. Reproducing that faithfully is what put the
     squash in ours. The panel is squared to 54 here instead: CS2's own
     avatar-ct/avatar-terrorist are 42x42, so a square source in a square box
     shows whole and undistorted, which is what the HUD is meant to read as. */
  /* 100%, not 54px: the container's 2.5px outline eats into its content box,
     so a hard 54 overflowed it and left the panel 28.4 x 30.4 -- still not
     square. 100% tracks the content box, which IS square. */
  #avct .pid-AvatarL__ImageBG, #avt .pid-AvatarL__ImageBG { height: 100%; }
  #avct .AavatarVisibleContainer img.AvatarL__Internal,
  #avt  .AavatarVisibleContainer img.AvatarL__Internal { object-fit: contain; width: 100%; height: 100%; }
  #teamsel h1 { font-size: 30px; letter-spacing: 7px; margin: 0; color: #e8edf2;
    text-shadow: 0 2px 14px rgba(0,0,0,0.85); font-weight: 800; }
  #teamsel .tsmap { font-size: 13px; letter-spacing: 3px; opacity: 0.65; margin-top: -16px; }
  #teamsel .tscards { display: flex; gap: 24px; }
  .tscard { width: 306px; height: 356px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.14); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; position: relative; overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
  .tscard:hover { transform: translateY(-6px); border-color: rgba(255,255,255,0.55); }
  .tscard.ct { background: linear-gradient(168deg, #2c4a6e 0%, #141d26 72%); }
  .tscard.t { background: linear-gradient(168deg, #6e5322 0%, #241c10 72%); }
  .tscard.ct:hover { box-shadow: 0 16px 44px rgba(70,130,200,0.35); }
  .tscard.t:hover { box-shadow: 0 16px 44px rgba(210,160,50,0.3); }
  .tscard .mono { font-size: 104px; font-weight: 900; font-family: var(--num-font); line-height: 1; }
  .tscard.ct .mono { color: var(--ct); text-shadow: 0 0 36px rgba(125,184,240,0.55); }
  .tscard.t .mono { color: var(--t); text-shadow: 0 0 36px rgba(234,190,84,0.5); }
  .tscard .tname { font-size: 16.5px; letter-spacing: 2.5px; font-weight: 700; }
  .tscard .tdesc { font-size: 12.5px; opacity: 0.65; letter-spacing: 0.4px; text-align: center;
    padding: 0 24px; line-height: 1.55; }
  #teamsel .tsback { background: none; border: none; color: #9aa7b4; font-size: 12px;
    letter-spacing: 2px; cursor: pointer; padding: 8px 14px; font-family: inherit; }
  #teamsel .tsback:hover { color: #fff; }
  /* shown only while the map is still loading behind the cards, or while the
     scene warms after a pick */
  #teamsel .tsload { display: none; width: 300px; }
  #teamsel .tsbar { height: 2px; background: rgba(255,255,255,0.10); overflow: hidden; }
  #teamsel .tsbar i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #5b8db8, #9fc4e8);
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
  #teamsel .tsrow { display: flex; justify-content: space-between; margin-top: 9px;
    color: #7f8b98; font-size: 10.5px; letter-spacing: 2.4px; }
  #teamsel .tspct { font-family: var(--num-font); letter-spacing: 1px; color: #9aa7b4; }
  /* before the map exists the canvas behind is a flat clear, so the veil is
     opaque and matches it; when the map lands the class goes and the gradient
     transition fades the flyover in instead of cutting to it */
  #teamsel { transition: background 0.7s ease; }
  #teamsel.tspreload { background: #0d1116; }
  /* ONCE A SIDE IS PICKED THE VEIL GOES SOLID, IMMEDIATELY.
     The build behind it finishes with `state = 'playing'` and starts round one,
     so the live HUD (freeze clock, round banner, radar, ammo) and the
     first-person view were drawing THROUGH the cards while the frame gate
     still held -- two screens at once. #teamsel is z-index 40 and the whole
     gameplay HUD is z-index auto, so an opaque background covers all of it and
     the 3D canvas besides. `transition: none` because fading to it over 0.7s
     would just show the mixed state for 0.7s. */
  #teamsel.tsloading { background: #0d1116; transition: none; }

  #teamsel.tsloading .tsload, #teamsel.tspreload .tsload { display: block; }
  #teamsel.tsloading .tsback { visibility: hidden; }
  #teamsel.tsloading .tscards { opacity: 0.4; pointer-events: none; transition: opacity 0.2s; }
  #teamsel .tsdots::after { content: ''; animation: tsdots 1.2s steps(4, end) infinite; }
  @keyframes tsdots { 0% { content: ''; } 25% { content: '.'; }
    50% { content: '..'; } 75% { content: '...'; } }
  #hp b, #armor b { font-size: 20px; opacity: 0.75; font-weight: 400; margin-right: 5px; }
  /* ---- CS2 bottom bar placement ------------------------------------------
     Everything inside is styled by ui/cs2_bottom.css, generated from Valve's
     hudhealthammocenter.vcss. Only the strip's place on OUR screen lives here:
     #HudBottomCenter is a full-width panel and .hud-HA is `vertical-align:
     bottom; horizontal-align: center`, so this is that panel. .hud-HA itself
     ships `opacity: 0` (a state class reveals it in CS2) -- shown here. */
  #cs2bottom { position: absolute; left: 0; right: 0; z-index: 5;
    bottom: calc(2px * var(--cs2-ui-scale, 1));   /* #HudBottomCenter margin-bottom */
    display: flex; justify-content: center; align-items: flex-end;
    pointer-events: none; }
  .cs2bt .hud-HA { opacity: 1; }
  /* The bar's own background is Valve's red gradient (the damage); the white
     ProgressBarLeft on top of it is the health remaining. Valve sizes it 65x8
     -- .hud-HA-bar,#AmmoClipBar { width:65px; height:8px }. */
  /* NO BLACK OUTLINE. Valve rings the bar `1px solid #000000`, which at our
     size reads as a hard box drawn around it rather than as a bar. The red
     track already separates it from the world. */
  .cs2bt .hud-HA-bar { display: block; position: relative; overflow: hidden;
    border: 0; }
  /* HEALTH REMAINING IS THE TEAM COLOUR. Valve fills it `#ffffff` -- the only
     white thing left on a bar that is otherwise entirely team-washed. The
     track behind it stays Valve's red, so the exposed part still reads as
     damage taken; only the remaining half changes hue. --wash comes from the
     `hud-colorize-wash` class on the element, CS2's own mechanism. */
  .cs2bt .hud-HA-bar .ProgressBarLeft { position: absolute; inset: 0 auto 0 0;
    height: 100%; transition: width 0.18s ease-out;
    background-color: var(--wash, #fff); }
  .cs2bt .hud-HA-bar .ProgressBarRight { display: none; }
  /* the badge circle takes hud-blur-bg-color + world-blur through an
     opacity-mask; in a browser that is a round box with a backdrop filter */
  .cs2bt .hud-HA-center { border-radius: 50%;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  /* ICON SIZES COME FROM THE LAYOUT, NOT THE SHEET. hudhealthammocenter.vxml
     carries them as texturewidth attributes on each Image -- armor 42px,
     helmet 46px, heavy 26px, the team logos 48px -- and CSS never sees them,
     so an extracted stylesheet alone leaves every one of these at 0x0. */
  .cs2bt .hud-HA-icon--armor  { width: 42px; height: 42px; }
  .cs2bt .hud-HA-icon--helmet { width: 46px; height: 46px; }
  /* NO --wash here: the badge takes its colour from Valve's own
     `.csgo-hud__color-0.HUD--team--ct .hud-colorize-wash` like everything else
     on the bar. Pinning it white was overriding the team colour. */
  .cs2bt .hud-HA-center-icon  { width: 40px; height: 40px; }
  .cs2bt .hud-HA-icon, .cs2bt .hud-HA-center-icon { align-self: center;
    justify-self: center; margin: auto; }
  .cs2bt .hud-HA-icon-outline-container { width: 46px; }
  /* A WASH ON TEXT IS ITS COLOUR; a wash on an image is a fill through the
     alpha. Panorama uses one property for both, and the converter can only
     emit `--wash`, so the text case is closed here. --wash itself is set by
     Valve's own rule -- `.csgo-hud__color-0.HUD--team--ct .hud-colorize-wash`
     -> ct-color / t-color -- which is why the bar takes your team's colour
     without a single colour being written in our code. */
  .cs2bt .Label.hud-colorize-wash { color: var(--wash, #fff); }
  /* THE RESERVE NUMBER SIZES TO ITS DIGITS. Valve pins it at `width: 30px`
     with `text-align: right`, which works in Panorama because the space to its
     left is empty -- the glyphs simply spill into it. Ours has the pipe there,
     so a three-digit reserve like 120 (~55px at 32px type) rendered straight
     through the divider and into the clip number. min-width keeps Valve's
     column for the common two-digit case. */
  /* THE RESERVE IS THE QUIET NUMBER. Valve sets it 32px against the clip's 42,
     and we matched that exactly -- but at three digits (120) a 0.76 ratio still
     reads as two numbers of equal weight. 26px puts the clip clearly in front,
     which is what the readout is for: the clip is what you act on, the reserve
     is a footnote. The min-width comes down with it so a two-digit reserve does
     not sit in a column wider than itself. */
  .cs2bt .hud-WPN-reserve-text__label { width: auto; min-width: 22px;
    padding-left: 2px; font-size: 26px; }
  /* THE RESERVE MARK IS ALWAYS SHOWN. Valve collapses it by default and reveals
     it with a class PAIR -- `.HUD--ammo-reserve--<type> .ammo-reserve--<type>`
     -- keyed on the magazine type. Driving the glyph off the FIRE MODE instead
     means those classes are never set, so the icon stayed collapsed and
     vanished. Shown outright; which glyph appears is decided in _setAmmo. */
  .cs2bt .hud-HA-icon-container .hud-WPN-ammo-reserve__icon { display: block; }
  /* SPACE AROUND THE MARK. Valve's icon container is a flush 32px column that
     butts straight against the reserve digits -- in CS2 the digits are pinned
     to a 30px box with room to spare on their left, so the gap comes for free.
     Ours sizes to its text, so the icon ended up touching the number. Given a
     margin of its own, and centred in its column rather than sitting wherever
     the 18px glyph lands in a full-height box. */
  .cs2bt .hud-HA-icon-container { margin-left: 6px;
    display: flex; align-items: center; justify-content: center; }
  .cs2bt .hud-WPN-reserve-text { width: auto; }
  /* the pipe takes Valve's own size and fade; it just needs to sit on the
     baseline between the two numbers rather than in its own grid cell */
  .cs2bt .hud-WPN-pipe { align-self: center; justify-self: center;
    line-height: 1; font-weight: 400; margin: 0 3px; }
  /* ADDITIVE. hudhealthammocenter.vxml marks both side containers and the badge
     circle `additive` -- Valve's additive blend -- which is what gives the bar
     its slightly see-through, lit look over the world rather than sitting on it
     as flat paint. `plus-lighter` is the CSS equivalent; `screen` is the
     fallback where it is not supported. */
  /* THE STROKES CARRY THE TEAM COLOUR END TO END. Valve draws them as a
     white-to-transparent gradient with a team wash multiplied over it; a
     browser cannot multiply a wash into a background-image, so the gradient is
     rebuilt from --wash directly -- same shape, one hue the whole way. */
  .cs2bt .hud-HA__stroke.left { background-image:
    linear-gradient(270deg, var(--wash, #fff) 0%, transparent 100%); }
  .cs2bt .hud-HA__stroke.right { background-image:
    linear-gradient(90deg, var(--wash, #fff) 0%, transparent 100%); }
  /* the badge ring: Valve's 3px, taking the team colour */
  /* THE BADGE DISC IS DARK GREY, as CS2 ships it. Valve fills it `#000000a0`
     -- flat black at alpha 0.627 -- and this is that, lifted off pure black to
     a dark grey and held a little more transparent so more of the world reads
     through. The team colour stays where it belongs: on the ring, the emblem
     and the two strokes. It kept `hud-colorize-wash` in the markup, which is
     harmless -- nothing here reads --wash any more. */
  .cs2bt .hud-HA-center { background-color: rgba(24, 28, 33, 0.55); }
  .cs2bt .hud-HA-center__circle__border { border: 3px solid var(--wash, #fff);
    border-radius: 50%; width: 100%; height: 100%; box-sizing: border-box;
    align-self: center; justify-self: center; }
  .cs2bt .additive { mix-blend-mode: screen; }
  @supports (mix-blend-mode: plus-lighter) {
    .cs2bt .additive { mix-blend-mode: plus-lighter; }
  }
  .cs2bt .hud-HA__stroke.hud-colorize-wash { background-color: var(--wash, #fff);
    opacity: 0.45; }
  /* the reserve icon is sized by the sheet but revealed by the class pair; a
     knife or the bomb has no ammo at all, so the whole right half goes */
  .cs2bt.no-ammo .hud-WPN-main { visibility: hidden; }
  #hud.inmenu #cs2bottom, #hud.teamselect #cs2bottom { display: none; }
  #armor { font-size: 26px; font-weight: 600; font-family: var(--num-font); color: #9fc4e8; }
  /* CS2's money, from hudmoney.vcss: the digits are `width: 18px; font-size:
     38px; font-weight: bold; color: defaultColor` (#ffffff) inside .money, an
     80px panel in #HudLowerLeft -- `horizontal-align: left; vertical-align:
     bottom` -- with .money-text sitting `y: -22px` off that bottom. So: bottom
     left, 38px bold white, ~22px up. It is white in CS2, not green; the green
     and red are the +/- animations (AddMoneyColor #8fff6f, RemoveMoneyColor
     #fd3535). */
  /* NO calc(* --cs2-ui-scale) HERE. Money used to sit outside the HUD scope and
     had to scale itself; it now lives inside .cs2bt, which already applies that
     factor as `zoom` -- so the multiply was happening twice and the readout
     came out 43.7px against the health's 42. Plain px, like every other value
     inside the scope, and matched to hud-HA-large-font-size so the two read as
     one line. (CS2's own money is 38px against health's 42; matched at request.) */
  #money { position: absolute; z-index: 5;
    left: 30px;
    bottom: 22px;
    font-size: 42px;
    font-weight: 700; font-family: 'Stratum2 Bold TF', 'Stratum2', var(--num-font);
    /* the same black outline the bar had -- an offset shadow plus a dark halo,
       which at 42px reads as an inked edge on the digits. Dropped; the figure
       sits on the team wash like every other number on the bar. */
    color: var(--wash, #fff); text-shadow: none; }
  /* THE CENTRE MUST NOT MOVE WHEN THE AMMO APPEARS.
     Both halves of the bar are `flex: 1 1 0` and so should be exactly equal --
     but a flex item defaults to `min-width: auto`, which refuses to shrink
     below its own content. Draw a knife and the ammo labels empty out; draw a
     gun and they fill, the right half claims 8px more than its share, and the
     badge and the health number slide 4px left. Measured: health at 411 with a
     knife, 407 with any gun, constant regardless of how many digits the ammo
     has -- it is the presence of content, not its width.
     `min-width: 0` lets both halves hold exactly half, so the centre is fixed
     and nothing reflows on a weapon switch. */
  .cs2bt .hud-HA-side { min-width: 0; }
  .cs2bt .hud-state, .cs2wp .hud-state { display: contents; }
  /* CS2 weapon list, bottom right. #HudBottomRight is `horizontal-align:
     right; vertical-align: bottom; flow-children: down`, and .weapon-row is
     300px wide with a 6px right margin -- so this is that column. Rows stack
     upward from just above the bottom bar. */
  #cs2weapons { position: absolute; z-index: 5; pointer-events: none;
    /* BACK INTO THE CORNER. The 22px reserve for the number that hangs off the
       glyph pushed the whole column inward; giving it a negative right instead
       keeps that room without moving the icons off the edge, so the column
       sits where it did before the number moved to the corner. */
    right: -6px;
    bottom: calc(26px * var(--cs2-ui-scale, 1));
    padding-right: 22px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
  .cs2wp .weapon-row { display: flex; justify-content: flex-end;
    position: relative; align-items: center; }
  /* THE ROW STACKS: glyph on top, name beneath. Valve's own container is a
     horizontal flow with the name beside the icon, so this is a deliberate
     departure from the sheet -- asked for directly. The class name is Valve's
     and now lies about its direction; kept so the generated rules still land. */
  .cs2wp .weapon-row-horiz-container { display: flex; flex-direction: column;
    align-items: flex-end; justify-content: flex-end; gap: 1px; }
  .cs2wp .weapon-selection-item { display: flex; flex-direction: row;
    align-items: center; gap: 8px; transform: none; position: relative; }
  .cs2wp .weapon-selection-item-icon { display: flex; flex-direction: row;
    align-items: center; gap: 8px; transform-origin: 100% 50%;
    transition: transform 0.12s ease-out; }
  /* VALVE'S 400px PHANTOM, CLEARED. `.weapon-selection-item--selected` carries
     `padding-left: 400px; margin-left: -400px` -- headroom for a slide-in
     transition we never run. The pair cancels for POSITION, so it looks
     harmless, but it leaves the selected item's box 400px wider than anything
     you can see, and anything anchored to that edge lands 400px out. That is
     exactly where the bomb went: 420px from the dots instead of 20. */
  .cs2wp .weapon-selection-item--selected.weapon-selection-item {
    padding-left: 0; margin-left: 0; }
  /* THE BOMB HANGS OFF THE LEFT OF THE DOT STRIP, on the same line. Anchored to
     the item box with `right: 100%` so it tracks the strip's edge instead of
     needing a magic offset, and absolute so it cannot widen the row or push
     the dots around. */
  .cs2wp .obj-cell { position: absolute; right: 100%; margin-right: 22px;
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: row; align-items: center;
    white-space: nowrap; }
  .cs2wp .obj-cell .weapon-selection-item-icon-main { width: 48px; height: 40px;
    opacity: 0.9; }
  /* SAME CORNER AS EVERY OTHER SLOT NUMBER -- the identical top/right offsets
     as .weapon-row-number, just anchored to the bomb's own box instead of the
     row's, so the 5 reads as this icon's number and not as loose text beside
     it. (.obj-cell is absolutely positioned, so it is the containing block.) */
  .cs2wp .obj-num { position: absolute; top: -7px; right: -16px;
    min-width: 14px; font-size: 18px; line-height: 1; opacity: 0.6;
    display: flex; align-items: center; justify-content: flex-end; margin: 0;
    color: var(--wash, #fff); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
  /* THE ONE IN YOUR HANDS GROWS -- per item, not per row. Slots 4 and 5 share
     a row, so "selected" cannot mean "everything here": pressing 4 lit all four
     cells and the bomb with them. The grenade cell and the bomb each carry
     their own --on, and only that one scales and goes full opacity. The strip
     itself still never scales (it would swell leftward into the bomb), so the
     growth is contained inside the item's own cell. */
  /* SLOT 4 AND 5 SHARE A ROW, so the row's own state must style nothing here --
     five things live in it and only one can be in your hands. Valve's row-level
     rules brighten and scale every glyph in a selected item, which lit all four
     grenades and the bomb together; both are cancelled for these cells and the
     highlight is re-applied to the one carrying --on. */
  .cs2wp .obj-cell .weapon-selection-item-icon-main,
  .cs2wp .nade-cell .weapon-selection-item-icon-main {
    opacity: 0.75; filter: none; transform: none;
    transition: transform 0.12s ease-out, opacity 0.12s, filter 0.12s; }
  .cs2wp .weapon-row--selected .nade-cell .weapon-selection-item-icon-main,
  .cs2wp .weapon-row--selected .obj-cell .weapon-selection-item-icon-main {
    opacity: 0.75; filter: none; transform: none; }
  /* four classes deep, and after the suppressor, so it wins on both counts */
  .cs2wp .weapon-row--selected .nade-cell--on .weapon-selection-item-icon-main,
  .cs2wp .weapon-row--selected .obj-cell--on .weapon-selection-item-icon-main,
  .cs2wp .weapon-row .nade-cell--on .weapon-selection-item-icon-main,
  .cs2wp .weapon-row .obj-cell--on .weapon-selection-item-icon-main {
    opacity: 1; filter: brightness(1.5); transform: scale(1.24); }
  .cs2wp .obj-num { opacity: 0.6; }
  .cs2wp .weapon-row .obj-cell--on .obj-num { opacity: 1; }
  @keyframes cs2wp-pop-cell {
    from { transform: scale(1); }
    to   { transform: scale(1.24); }
  }
  .cs2wp .weapon-row--pop .nade-cell--on .weapon-selection-item-icon-main,
  .cs2wp .weapon-row--pop .obj-cell--on .weapon-selection-item-icon-main {
    animation: cs2wp-pop-cell 0.11s cubic-bezier(0.16, 0.84, 0.32, 1); }

  /* BIGGER. Valve authors this at a 1080p reference where the icons are ~46px
     wide; on our screen the column read as an afterthought, so the glyphs and
     type are stepped up together and the rows given room to breathe. */
  .cs2wp .weapon-selection-item-icon-main { width: 74px; height: 40px;
    transform: none; margin-right: 0; opacity: 0.75; }

  /* THE ACTIVE GLYPH GROWS AND STAYS GROWN. The scale-up is the RESTING state,
     so the weapon in your hands is permanently the biggest thing in the column;
     the keyframe only animates the way IN to that size. It used to overshoot to
     1.32 and settle back to 1.16, which reads as "grew, then shrank" -- the
     shrink is the part you notice. Pure ease-out to the resting size instead:
     the motion ends where the icon lives. The origin is the right edge so
     growing pushes into the screen instead of off it. */
  .cs2wp .weapon-row--selected .weapon-selection-item-icon { transform: scale(1.45); }
  @keyframes cs2wp-pop {
    from { transform: scale(1); }
    to   { transform: scale(1.45); }
  }
  .cs2wp .weapon-row--pop .weapon-selection-item-icon {
    animation: cs2wp-pop 0.11s cubic-bezier(0.16, 0.84, 0.32, 1); }
  /* THE GRENADE STRIP DOES NOT GROW. The scale-up is authored for a single
     glyph; applied to a four-cell strip it swells 99px LEFTWARD (the origin is
     the right edge) and swallows the bomb sitting there -- measured, the 22px
     gap became a 40px overlap. A transform never moves layout, so no anchor can
     track it; the strip simply keeps its size. Selection still reads on this
     row through the name and the brighter dots and number. */
  .cs2wp .weapon-row--selected .weapon-selection-item-icon.nade-cells,
  .cs2wp .weapon-row--selected .weapon-selection-item-icon.per-item,
  .cs2wp .weapon-row--pop .weapon-selection-item-icon.nade-cells,
  .cs2wp .weapon-row--pop .weapon-selection-item-icon.per-item {
    transform: none; animation: none; }

  /* SLOT 3 IS SHARED WHEN YOU OWN A ZEUS -- knife and taser side by side -- so
     it gets the same treatment as slot 4: the row's state styles nothing, and
     the one glyph carrying `wpn-on` takes the highlight. It keeps the weapon
     rows' 1.45, not the 1.24 the grenades use, so a knife grows like a gun. */
  /* ROOM FOR THE ONE THAT GROWS. The glyphs scale from their RIGHT edge
     (transform-origin: 100% 50%, inherited from the strip), so a selected knife
     expanded 33px straight into the Zeus parked beside it -- a transform never
     reserves space, so nothing moved out of the way. Growing from the centre
     halves the intrusion to ~17px, and a 22px gap absorbs it. Only ever one of
     the two is scaled, so the gap only has to clear one side. */
  .cs2wp .weapon-selection-item-icon.per-item { gap: 22px; }
  .cs2wp .per-item .weapon-selection-item-icon-main {
    opacity: 0.75; filter: none; transform: none; transform-origin: 50% 50%;
    transition: transform 0.12s ease-out, opacity 0.12s, filter 0.12s; }
  .cs2wp .weapon-row--selected .per-item .weapon-selection-item-icon-main {
    opacity: 0.75; filter: none; transform: none; }
  .cs2wp .weapon-row .per-item .weapon-selection-item-icon-main.wpn-on {
    opacity: 1; filter: brightness(1.5); transform: scale(1.45); }

  /* THE SLOT NUMBER RIDES THE GLYPH'S TOP-RIGHT CORNER. Positioned against
     .weapon-selection-item, which wraps only the glyphs, so it lands on the
     icon rather than on the row. Absolute placement also retires the old
     line-box centring fight: Valve's `vertical-align: top` and
     `margin-bottom: 5px` cannot move a box that has an explicit top/right. */
  .cs2wp .weapon-row-number { position: absolute; top: -7px; right: -16px;
    min-width: 14px; height: auto; opacity: 0.6;
    font-size: 18px; line-height: 1; color: var(--wash, #fff);
    display: flex; align-items: center; justify-content: flex-end;
    margin: 0; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
  /* THE SELECTED COLOUR IS CS2'S OWN, and it was going unused. Valve's rule
     for a chosen weapon is `filter: brightness(1.5); opacity: 1.0` against the
     unselected `opacity: 0.8` -- so the highlight is a BRIGHTER wash, not just
     a less transparent one. We had only ever copied the opacity half, which is
     why every glyph sat at the same orange and nothing looked picked. */
  .cs2wp .weapon-row--selected .weapon-selection-item-icon-main {
    filter: brightness(1.5); opacity: 1; }
  .cs2wp .weapon-row--selected .weapon-row-number { opacity: 1; }
  .cs2wp .HUD--team--ct .weapon-row--selected .hud-colorize-wash--hsv {
    --wash: rgb(150, 200, 250); }
  .cs2wp .HUD--team--terrorist .weapon-row--selected .hud-colorize-wash--hsv {
    --wash: #eabe54; }

  /* THE NAME IS WHITE, not the team colour -- it is a label, and reading it
     against the gold glyphs is the whole point. Its height is reserved on every
     row even while hidden, so the column does not jump as the label fades in
     and out under whichever weapon is selected. */
  /* `width: auto` IS LOAD-BEARING. Valve's own rule is `width: 1px` with
     `overflow: visible` -- a zero-width anchor the label hangs off to the left.
     Pairing that 1px with our `overflow: hidden` clipped the name down to a
     single column of pixels. The box sizes to its text instead, and the column's
     flex-end alignment right-aligns it under the glyph. */
  .cs2wp .weapon-selection-item-name { position: static; flex: 0 0 auto;
    width: auto; max-width: 250px; height: 17px; display: flex;
    align-items: center; justify-content: flex-end; margin: 0; opacity: 0;
    overflow: visible; transition: opacity 0.12s; }
  .cs2wp .weapon-row--selected .weapon-selection-item-name { opacity: 1; }
  /* the grenade row's icons are taller than a single glyph once one of them is
     expanded, so its label needs more clearance than the gun rows do */
  .cs2wp .weapon-row.nade-row .weapon-selection-item-name { margin-top: 6px; }
  .cs2wp .weapon-selection-item-name-text { font-size: 16px; white-space: nowrap;
    position: static; flex: 0 0 auto; text-align: right; letter-spacing: 0.4px;
    line-height: 17px; color: #ffffff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }

  /* SLOT 4 COUNTS IN PIPS. CS2 sizes that row by how many you hold
     (grenade-bg-pip-width-3/4/5); the count itself is dots, not a number. */
  .cs2wp .weapon-selection-item-count { display: none; }
  .cs2wp .weapon-selection-item-pips { display: flex; gap: 3px;
    align-items: center; margin-top: 1px; }
  /* THE DOT STANDS WHERE THE GLYPH WILL GO. Slot 4 is four fixed-width cells
     -- the carry limit -- and each one holds either a grenade's icon or, while
     that slot is empty, a dot in the icon's own position. Picking a grenade up
     replaces the dot in place. The cells are narrower than a gun's 74px so the
     four of them read as one group rather than a row across the screen. */
  .cs2wp .nade-cell { width: 48px; height: 40px; display: flex;
    align-items: center; justify-content: center; flex: 0 0 auto; }
  .cs2wp .nade-cell .weapon-selection-item-icon-main { width: 48px; height: 40px; }
  .cs2wp .weapon-selection-item-icon.nade-cells { gap: 0; }
  /* THE EMPTY DOTS ARE DARK, NOT TEAM-COLOURED. A washed dot reads as a small
     lit thing -- as if something were there -- which is the opposite of what an
     empty carry slot should say. Near-black at 62% lets the world through and
     reads as a hole. Same 7px as before, and the same in every state: a dot
     means "empty" whether or not slot 4 is the one in your hands. */
  .cs2wp .nade-dot { width: 7px; height: 7px; border-radius: 50%;
    background: rgba(12, 14, 17, 0.92); opacity: 1; box-shadow: none; }

  /* THE OBJECTIVE ROW SITS OUT TO THE LEFT. Valve's own
     `@define objective-container-position-4: -225px` with
     `.weapon-row.gear-slot--4, .weapon-row.kit { transform: translateX(...) }`
     -- gear hangs away from the weapon column. Only the defuse kit takes it
     now; the bomb is slot 5 and belongs in the column with its number. */
  /* -189px, not Valve's -225px: measured, the kit glyph sat 43px further left
     than the bomb that now rides the slot-4 line, so the two objectives read as
     two unrelated strays. This lands the kit directly under the bomb. */
  .cs2wp .weapon-row.kit { transform: translateX(-189px); }
  /* the grenade rows keep the weapon column's position -- only the objective
     row hangs out to the left */
  .cs2wp .weapon-row.nade-row { transform: none; }

  #hud.inmenu #cs2weapons, #hud.teamselect #cs2weapons { display: none; }

  #statr { position: absolute; right: 16px; bottom: 14px; text-align: right;
    background: linear-gradient(180deg, rgba(10,13,16,0.0), rgba(10,13,16,0.55)); padding: 6px 16px 8px;
    border-radius: 4px; }
  #wname { font-size: 12px; letter-spacing: 2px; opacity: 0.8; text-transform: uppercase; }
  #ammo { font-size: 38px; font-weight: 700; font-family: var(--num-font);
    text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
  #ammo .res { font-size: 20px; opacity: 0.6; }
  #slots { margin-top: 3px; }
  #slots span { display: inline-block; width: 19px; height: 19px; line-height: 19px; text-align: center;
    background: rgba(0,0,0,0.45); margin-left: 4px; border-radius: 2px; font-size: 11px; opacity: 0.55; }
  #slots span.on { background: var(--accent-dim); opacity: 1; outline: 1px solid var(--accent); }

  /* CS2-style match bar: [CT] [clock] [T] segments */
  /* The score/timer block is Valve's own markup styled by
     ui/cs2_teamcounter.css. Only its placement on OUR screen lives here. */
  #scorebar { flex: none; }
  /* THE PLATE IS A BACKDROP, SO IT MUST NOT SIZE THE BLOCK. Valve's
     #ScoreAndTimeAndBomb is `height: fit-children` around the timer and score
     rows (~62px), and Panorama clips the 106px plate inside it. In CSS the
     plate was a grid child in the same cell, so `fit-content` measured IT --
     the block grew to 106px and the plate hung 44px below the cards. Taking it
     out of flow leaves the block at its text height and the clip does the rest.
     It keeps Valve's 106px so the mask stays calibrated (below); only the
     bottom of that mask is cropped away, which is what CS2 shows. */
  #scorebar .pid-ScoreAndTimeAndBombBG { position: absolute; top: 0; left: 50%;
    transform: translateX(-50%); height: 72px; }
  /* SHORTENING THE PLATE WITHOUT BREAKING ITS MASK.
     score-time-mask.svg is 106x130: solid band 0->39.92 (the timer strip),
     then two columns fading to transparent at 130. Stretched with
     `mask-size: 100% 100%` the band scales with the box, so any height under
     ~104px shrinks the band below the 32px timer and the digits fall off it.
     Pinning the mask to a FIXED 112px height keeps the band at 34.4px
     (39.92/130 * 112) no matter how short the box is.
     The box is then 72px, and a second mask layer -- a gradient -- finishes
     the fade inside those 72px so the bottom edge is soft instead of the ~46%
     alpha cut the SVG alone would leave. `intersect` shows a pixel only where
     BOTH masks keep it, so Valve's shape (band, 2px gutter, columns) survives.
     The gradient holds full strength to 82% and only softens the last sliver. */
  /* OUR OWN PLATE. Valve fills this `#000000f0` and cuts its shape with
     score-time-mask.svg (a solid timer band plus two fading columns); both are
     replaced by a soft dark panel with rounded lower corners, a faint lit line
     along the top where it meets the team cards, and a fade at the bottom so
     there is no hard edge -- solid enough that white digits read against a
     bright skybox, sheer enough that the world still moves behind it.
     The mask must be cleared with the `mask` SHORTHAND: killing mask-image
     alone leaves mask-size and mask-composite behind and the old shape
     returns. */
  #scorebar .equipinfo--score-time__bg {
    background: linear-gradient(180deg,
        rgba(33, 36, 42, 0.88) 0%,
        rgba(33, 36, 42, 0.84) 55%,
        rgba(33, 36, 42, 0.68) 88%,
        rgba(33, 36, 42, 0.50) 100%);
    border-radius: 0 0 9px 9px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    -webkit-mask: none; mask: none; }
  /* ...and it must NOT be clipped to the block. The mask fades the plate from
     opaque at 42/130 to transparent at 130/130; cutting that off at the text's
     bottom (~62 of 106px) stops it at ~77% alpha, which reads as a hard black
     brick instead of a fade. Out of flow it costs no layout height, so letting
     it overflow gives the soft bottom edge without the gap underneath. */
  #scorebar .pid-ScoreAndTimeAndBomb { overflow: visible; }
  /* #BombStatus is an overlay too (Valve gives it y:-23px and 80px of height
     inside a flow-children:none parent). Left in flow its 80px would size the
     block exactly like the plate did, so it comes out of flow as well -- its
     own translate carries Valve's -23px offset. */
  /* absolute so its 80px cannot size the block -- but KEEP Valve's own
     `top: -23px`. Overriding that to 0 dropped the icon 23px, which parked it
     over the scores instead of the black band. With -23 the icon's centre
     lands at 17px and the band's centre is 17.2px. */
  #scorebar .pid-BombStatus { position: absolute; top: -23px; left: 0; right: 0; }
  /* CS2 offsets this icon (x: 30% on a 50%-wide image) because its own
     BombStatus panel carries more than we draw. On its own it reads as simply
     off-centre, so it is centred here -- a deliberate deviation. */
  /* Sized to SIT INSIDE the black band, not just centre on it. Valve's
     `height: 60%` of the 80px BombStatus is 48px, and the mask's solid band is
     39.92/130 * 112 = 34.4px -- so the icon overhung the black top and bottom.
     26px leaves ~4px of black above and below it. */
  /* icon + countdown, centred together in the band. The panel keeps Valve's
     -23px offset and 80px height, so centring inside it lands on the band. */
  #scorebar .pid-BombStatus { display: flex; align-items: center;
    justify-content: center; gap: 4px; }
  /* BIGGER AND BRIGHTER THAN VALVE'S WASH. At 26px in #b80000 on the black
     plate the icon was there but read as nothing ("the bomb icon is not
     showing"): the countdown's own red at 30px is what you can actually see. */
  #scorebar .pid-BombStatus .bomb_planted { position: static; left: auto;
    width: 30px; height: 30px; flex: none; --wash: #ff2d20; }
  #scorebar .bomb-time { font-size: 22px; font-weight: 700; color: #ff2d20;
    line-height: 1; flex: none; }
  /* The C4 PULSES the way CS2's does (Valve's `bombDet`: opacity 0.5 -> 1 ->
     0.5 at 0.8 s, 0.5 s under 20 s, 0.3 s under 10 s -- hud.js retags the tier
     as the fuse shortens). It never dims past half, so it stays readable; the
     countdown beside it does not blink at all, so it can be read. */
  #scorebar .bomb-time { animation: none; opacity: 1; }

  /* THE PLATE'S HEIGHT IS CALIBRATED TO ITS MASK -- do not "shorten" it.
     score-time-mask.svg is 106x130: a solid full-width band from 0 to 39.92
     (the timer strip), then two 52-wide columns split by a 2px gutter, each
     fading to transparent downward (the score backdrops). Stretched over
     Valve's 106px container that band lands at 39.92/130 * 106 = 32.6px --
     exactly the 32px timer. Shrinking the box to 68px shrank the band to 21px
     and pushed the timer off it onto the split columns. The plate extends
     below the scores because the mask FADES it out there; that fade is the
     look, not overhang. */
  #hud.nofps #fps { display: none !important; }   /* Settings > Show FPS: Off */
  /* THE TOP-RIGHT ROW: fps readout + site badge in one flex row. The readout's
     width changes with every reading (position, draw calls, render scale), so
     a fixed right offset either overlapped the badge or wasted space; as flex
     siblings it always ends one gap short of the badge, whatever it says. */
  #topright { position: absolute; top: 6px; right: 12px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
  #fps { text-align: right; font-size: 11px; opacity: 0.7; white-space: nowrap;
    background: rgba(10,14,18,0.5); padding: 4px 8px; border-radius: 3px; }
  /* the site badge: the site's name, at the right end of the row */
  #sitebadge { display: flex; align-items: center; gap: 7px;
    padding: 4px 9px; border-radius: 8px; background: rgba(10,14,18,0.45); pointer-events: none; user-select: none; }
  /* the badge is the menu's #logo wordmark at badge size: same font, 900 italic,
     letter-spacing 2px-at-40px = 0.05em, the .IO in accent green at 24/40 = 0.6em */
  #sitebadge .sb-name { font-weight: 900; font-style: italic; font-size: 19px; letter-spacing: 0.05em;
    color: #e8eef2; text-shadow: 0 1px 5px rgba(0,0,0,0.7); line-height: 1; }   /* the menu's text colour, as #logo inherits it */
  #sitebadge .sb-name span { color: var(--accent); font-size: 0.6em; }

  /* CS2 KILL FEED, 1:1 from panorama/styles/hud/huddeathnotice.vcss.
     Every number below is Valve's, at Panorama's 1080p design height: the
     72px top margin and 10px right padding on the container, 3px between
     rows, 3px corner radius, 6/10/3/10 content padding, 16px labels, 24px
     weapon/modifier icons, 20px square honour icons, and the in-air icon's
     deliberate -4px/-14px overhang. `hud-blur-bg-color` resolves to #000000a0
     in panorama/styles/csgostyles.css -- it is a blur behind glass in CS2,
     which a canvas HUD cannot do, so the alpha carries it alone. */
  #killfeed { position: absolute; top: 72px; right: 10px; display: flex; flex-direction: column;
    align-items: flex-end; }
  .kf { background: #000000a0; border-radius: 3px; padding: 6px 10px 3px 10px; margin-top: 3px;
    display: flex; align-items: center; font-size: 16px; line-height: 1;
    transition: opacity var(--cs2-killfeed-duration, 1s) ease-out; }
  /* CS2 draws the two rows you are in completely differently, and they are not
     the same thing: DeathNotice_Killer (you got the kill) is a red-bordered
     near-black row with heavier, wider-tracked text; DeathNotice_Victim (you
     died) is a dark red fill with no border. */
  /* the red border is on `.DeathNoticeBGBorder`, a sibling panel behind the
     content, so in CS2 it changes neither the row's size nor where the text
     sits. An inset shadow reproduces that exactly; a real `border` would have
     needed the padding compensating and still shifted the row by 2px. */
  .kf.kf-killer { box-shadow: inset 0 0 0 2px #e10000; background: #000000e7; }
  .kf.kf-killer span { font-size: 15px; font-weight: 900; letter-spacing: 0.5px; }
  .kf.kf-victim { background: #630606d2; }
  .kf span { margin: 0 2px 2px 2px; max-width: 160px; max-height: 32px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; text-shadow: 1px 1px 1px #000; font-weight: 700; }
  .kf .ct { color: #6f9ce6; }      /* @define CTColor */
  .kf .t  { color: #eabe54; }      /* @define TColor  */
  .kf .wep { color: #888888; }     /* @define FadedColor */
  /* one size for every icon in the row: CS2's `.DeathNoticeIcon`. `.HonorIcon`
     (20px square) exists in the stylesheet but is applied to nothing in
     huddeathnotice.vxml, so revenge and domination are 24px like the rest. */
  .kficon, .kfhs { height: 24px; width: auto; margin: -2px 2px 0 2px; vertical-align: middle; }
  .kfair { margin-right: -4px; margin-top: -14px; }
  .kf.fade { opacity: 0; }
  /* the .2s ease-out slide the rows below a retiring one get in CS2 */
  .kf.collapse { height: 0 !important; margin-top: 0; padding-top: 0; padding-bottom: 0;
    opacity: 0; overflow: hidden;
    transition: height 0.2s ease-out, margin-top 0.2s ease-out, padding 0.2s ease-out, opacity 0.2s ease-out; }

  /* 128px, not 17%: the buy block is centred and ~64% of the height tall, so
     its top edge sits at ~17% of the height (159px on a 934px pane, 219px on
     a 1290px window) -- at 17% the round text ("Round 1 -- plant the bomb",
     "GO GO GO!") printed straight behind the block's money bar. The text now
     stacks in PIXELS under the top plate like the freeze-time line does:
     plate 0-106, "Buy period" 110-125 (#freezeov), this at 128-158, the buy
     block from 159 up. Percentages moved with the window; the plate and the
     block's top edge in pixels do not. */
  /* ...and CENTRED in the gap between that line and the block, not jammed
     under the line ("a bit too high"): the block's top edge is ~17% of the
     height, the line ends at 125px, the text is 30px tall, so the middle of the
     gap is (125 + 17%) / 2 - 15 = 8.5% + 47px. 127px on a 934px pane (as before),
     157px on a 1290px window. */
  #announce { position: absolute; top: calc(8.5% + 47px); width: 100%; text-align: center; font-size: 25px; font-weight: 700;
    letter-spacing: 0.5px; text-shadow: 0 2px 6px rgba(0,0,0,0.85); opacity: 0; transition: opacity 0.4s; }
  #reward { position: absolute; top: 56%; width: 100%; text-align: center; font-size: 17px; font-weight: 700;
    color: var(--money); text-shadow: 0 1px 4px rgba(0,0,0,0.85); opacity: 0; transition: opacity 0.3s; }

  #dmgov { position: absolute; inset: 0; opacity: 0; background:
    radial-gradient(ellipse at center, rgba(200,0,0,0) 55%, rgba(200,0,0,0.55) 100%); }
  #flashov { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 60; pointer-events: none; }
  /* CS2 sniper scope, from CS2's OWN HUD art.
     The pieces live in the PANORAMA image tree -- panorama/images/hud/scope/ --
     not in materials/. That folder is the whole answer:
       scope_circle  the aperture: a HARD-edged transparent disc on black, one
                     texture, no mirroring, ~3% feather
       scope_lens    the glass: a gentle warm vignette (alpha 59 at centre,
                     198 in the corners). NOT DRAWN -- see the .sc-mask block
       scope_line_blur  the hairline, stretched on both axes
     The materials/sprites/scope_arc quadrant is a much softer 7.4% edge and is
     NOT what the HUD draws; everything under models/weapons/shared/scope/ is
     the 3D lens on the weapon model.

     The lens is a SQUARE, centred, sized off the viewport HEIGHT -- see
     SCOPE_H in hud.js for the fraction and why it is not 1. scope_circle's disc
     is 0.941 of its half-width, so 106.3% puts its edge exactly on the lens
     edge. The black around it is the lens's own box-shadow. The hairlines run
     the FULL SCREEN, past the aperture, which is where CS2 draws them too (and
     black on black is invisible out there in any case).
     Every geometry value here is overwritten per-resize by _snapScopeLens();
     what the stylesheet holds is only the pre-measure fallback. */
  /* THE HUD SITS ON TOP OF THE SCOPE, NOT UNDERNEATH IT.
     The blackout around the aperture is the lens's own `box-shadow` -- a
     100vmax spread of solid #000 -- so it covers every HUD child the browser
     paints BEFORE it, and #scopeov is built two-thirds of the way down the HUD
     tree. Scoping therefore swallowed the radar, the killfeed, the hitmarker,
     the damage arcs, the target ID and the announcements: exactly the readouts
     you most want while holding an angle, and all of them are visible in CS2's
     own scoped frame.
     Ordering it by z-index instead of by DOM position says what is actually
     true: the aperture is part of the VIEW, and the HUD is drawn over the view.
     #hud is a stacking context (position: fixed + z-index: 10) with no
     background of its own, so a negative z-index puts these two behind every
     other HUD child while still keeping them above the canvas.
     The smoke tint goes one layer further down for the same reason -- it is
     what being inside a smoke looks like, so it belongs INSIDE the aperture;
     painted over the surround it would wash the whole scope out to grey. */
  #scopeov { position: absolute; inset: 0; display: none; overflow: hidden; z-index: -1; }
  #smokeov { z-index: -2; }
  /* THE SIDE BLACKOUT HAS TO OVERLAP THE LENS, NOT ABUT IT.
     The lens is centred with left:50% + translateX(-50%), so whenever
     (viewportWidth - viewportHeight) is ODD it lands on a HALF pixel -- e.g.
     1079x836 puts its edges at 121.5 and 957.5. The element's own paint is
     clipped at that boundary and the surrounding box-shadow starts at it, and
     the two do not always composite to a full pixel: the result is a hairline
     of the live scene showing down one side of the scope. The inset ring paints
     the last 2px INSIDE the lens solid black, which bridges the seam. It is
     invisible otherwise -- scope_circle is already black out at that radius. */
  #scopeov .sc-lens { position: absolute; top: 0; bottom: 0; left: 50%;
    aspect-ratio: 1 / 1; transform: translateX(-50%); overflow: hidden;
    box-shadow: 0 0 0 100vmax #000, inset 0 0 0 2px #000; }
  #scopeov i { position: absolute; display: block; }
  /* NO GLASS LAYER. It used to draw scope_lens.png -- CS2's photographed lens
     vignette -- masked to a ring around the aperture. There is no mask width
     that works: the art is a broad photographic falloff, so any band wide
     enough to read as a lens rim is also wide enough to read as a black edge
     eating the sight picture, and because the photo's vignette is not radially
     even it ate hardest at the top and the two bottom quarters. Tightening it
     twice only made the band thinner, never absent. CS2's own scoped frame has
     a HARD edge, so the honest match is no rim at all.

     THE APERTURE IS CUT HARD, AND A HAIR INSIDE THE LENS BOX.
     scope_circle.png still lays down the black, but its alpha ramp is a ~3%
     feather that upscales to a visibly soft edge at this size, so the gradient
     on top of it does the actual cutting: clear to 95% of the aperture radius,
     solid by 96%. The 1% is only there to keep the edge from aliasing into a
     staircase. Cutting at 96% rather than 100% also pulls the visible circle
     that last touch inward, which is what puts the old soft rim OUTSIDE the
     sight picture instead of inside it. Effective diameter is therefore
     0.96 * SCOPE_H of the viewport height, not SCOPE_H -- so raising or
     lowering SCOPE_H is the knob for the scope's size, and this 96% stays put.

     The art goes through --ap rather than being named inline, because
     _preloadScopeArt() swaps in a decoded blob: URL at boot and an inline
     `background-image` would replace BOTH layers -- taking the cut with it. */
  #scopeov .sc-mask { inset: 0; --ap: url(textures/scope_circle.png);
    background:
      radial-gradient(circle closest-side at center, transparent 0 95%, #000 96%),
      var(--ap) center/106.3% 106.3% no-repeat; }
  /* SHARP hairlines. The file is named scope_line_BLUR for a reason -- it is a
     pre-blurred line, and stretching it across the screen is what made the
     crosshair look soft while standing still. CS2's scope crosshair is a hard
     thin black line; the engine draws it as a solid rect, which is why the
     panorama folder ships no sharp version to extract. Two device pixels. */
  /* The hairlines BLUR with inaccuracy (CS2): razor sharp when you are still
     and settled, softening as movement or air opens the cone, so the scope
     itself tells you the shot is not trustworthy. Driven from the real scoped
     cone in hud.updateCrosshair -- see there for the curve. */
  #scopeov .sc-line { left: 50%; top: 50%; background: #000; will-change: filter; }
  #scopeov .sc-line.v { width: 2px; height: 200vmax; transform: translate(-50%, -50%); }
  #scopeov .sc-line.h { height: 2px; width: 200vmax; transform: translate(-50%, -50%); }

  #respawn { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(60,0,0,0.25); font-size: 32px; font-weight: 800; gap: 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
  #respawn .small { font-size: 16px; font-weight: 400; opacity: 0.85; }

  /* ---- CS2 scoreboard -------------------------------------------------
     THE PANEL IS NOT STYLED HERE ANY MORE. Every rule that draws it now comes
     from ui/cs2_scoreboard.css, which tools/cs2_panorama_css.py generates from
     Valve's own panorama/styles/scoreboard.vcss (452 rules) -- the same route
     the top player strip already takes. What used to live here was a set of
     vh values transcribed by hand out of that file; transcription is how the
     panel ended up close but never right.

     Only its PLACEMENT ON OUR SCREEN belongs here: Panorama centres .sb-main
     in a full-screen root, and we have to give it that root. `zoom` on .cs2sb
     rescales Valve's 1080p-reference px, so the box it occupies is already in
     scaled units -- inset:0 plus its own horizontal/vertical centring does the
     rest. */
  #scoreboard { display: none; position: absolute; inset: 0; z-index: 6;
    pointer-events: none; }
  /* Panorama centres .sb-main inside a full-screen root; this is that root.
     The centring must happen OUTSIDE .cs2sb, because .cs2sb carries the
     zoom -- a percentage width on a zoomed box is a percentage of the SCALED
     space, which is how the panel ended up hanging off the left edge. */
  #scoreboard.on { display: grid; place-items: center; }
  #scoreboard > .cs2sb { display: grid; place-items: center; }
  /* Valve sizes CSGOAvatarImage from the engine side (it is a real panel type
     that measures its own texture), so the sheet gives it only background-size.
     In a browser it needs the box too -- the cell is already square. */
  .cs2sb .sb-row__cell--avatar .CSGOAvatarImage { width: 100%; height: 100%;
    background-position: center; }
  /* Valve hides the meta buttons behind `.mouse-active-visible` (opacity 0
     until the cursor is live on the panel). CS2 has a cursor on the scoreboard;
     this game holds TAB with the mouse locked, so that state never arrives and
     the buttons would never show. Shown at the opacity CS2 fades them to. */
  /* Valve sets the server line at 14px and right-aligns it; only the size is
     changed here -- with the button group gone it carries that row alone. The
     alignment stays Valve's (horizontal-align: right). */
  .cs2sb .pid-id-sb-meta__labels__server-viewers { font-size: 17px; }
  /* THE TEAM LOGO BEHIND THE SCORE, and the ping column's header glyph.
     Both are artwork CS2 supplies from the engine rather than from a rule --
     `sb-team-logo-background--CT` appears in scoreboard.vxml with no matching
     declaration in any panorama sheet -- so the sizing is ours even though the
     art is Valve's (ui/sb_logo_ct.svg, ui/sb_logo_t.svg, ui/sb_ping4.svg).
     Both are washed, so they take the same per-team tint as every other icon. */
  .cs2sb .sb-team__info__score .sb-team-logo { width: 76%; height: 76%;
    align-self: center; justify-self: center; opacity: 0.22; }
  .cs2sb .sb-row__cell--ping .sb-ping-header { width: 29px; height: 25px;
    align-self: center; justify-self: center; opacity: 0.55; }

  /* bomb mode HUD */
  #progresswrap { position: absolute; left: 50%; bottom: 26%; transform: translateX(-50%); width: 300px;
    text-align: center; }
  #progresslabel { font-size: 12px; font-weight: 700; letter-spacing: 3px; margin-bottom: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
  #progressouter { height: 8px; background: rgba(0,0,0,0.6); border-radius: 2px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.22); }
