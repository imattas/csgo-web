  #progressinner { height: 100%; width: 0%; background: var(--accent); }
  #usehint { position: absolute; left: 50%; bottom: 32%; transform: translateX(-50%); font-size: 15px;
    font-weight: 600; background: rgba(10,13,16,0.65); padding: 8px 18px; border-radius: 4px; opacity: 0;
    transition: opacity 0.2s; white-space: nowrap; }
  /* CS2 has no giant countdown digit: the freeze counts down on the team
     counter's own timer. This overlay sat at 56px -- straight across the lower
     half of Valve's 106px plate -- which is why the plate looked missing during
     the countdown. The digit is gone; the buy hint drops below the plate. */
  #freezeov { position: absolute; top: 110px; width: 100%; display: none; flex-direction: column;   /* 110: just under the 106px plate, so #announce fits between it and the buy block */
    align-items: center; pointer-events: none; }
  .fz-num { display: none; }
  .fz-sub { font-size: 13px; opacity: 0.85; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,0.85); }
  #spectatebar { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); font-size: 14px;
    letter-spacing: 1px; background: rgba(10,13,16,0.75); padding: 10px 22px; border-radius: 4px; }
  #spectatebar b { color: var(--accent); }

  /* buy menu — CS2 dark panel */
  /* ============ buy menu: CS2's panorama/styles/buymenu.css, in CSS ============
     950px left block at 18/18/22/24/18 % columns, radial-gradient item cards
     with the key top-left / name top-right / price bottom-right, the info
     panel to the right of the columns beside the agent, nav bar along the
     bottom. The game is dimmed, not blurred (see the pause note below). */
  #buymenu { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    pointer-events: auto !important; font-family: 'Stratum2', 'Stratum2 TF', sans-serif; color: #fff;
    /* THE BLOCK AND THE AGENT ARE ONE GROUP, CENTRED. The block is --bmw wide;
       the agent gets a strip --bmagent wide, --bmgap to its right; the pair is
       centred, so the block's left margin equals the strip's right margin.
       main.js stands the agent in the middle of that strip (it reads the
       block's rect, so these numbers live here only). The old layout parked
       the block at the top-left and the agent at the far right edge. */
    --bmw: min(52vw, 950px); --bmgap: 40px; --bmagent: 40vh; }
  /* --bmshift (hud.js fit) nudges the whole group right: centred as a group the
     block's own centre sits at 39% of the width whatever its size, and the user
     asked for it closer to the middle. 5vw puts it at ~44% with the agent still
     clear of the right edge. */
  .bm-left { position: absolute; left: calc(50% - (var(--bmw) + var(--bmgap) + var(--bmagent)) / 2 + var(--bmshift, 0px)); top: 50%;
    transform: translateY(-50%) scale(var(--bms, 1)); transform-origin: 50% 50%;
    width: var(--bmw); display: flex; flex-direction: column; }
  .bm-info { display: flex; align-items: center; height: 40px; padding: 0 14px; background: rgba(0,0,0,0.62);
    font-family: 'Stratum2 Bold TF', 'Stratum2'; }
  .bm-money { color: #e2c46a; font-size: 24px; min-width: 130px; font-family: 'Stratum2 Bold TF'; }
  .bm-timer { margin: 0 auto; font-size: 17px; color: #d6d6d6; }
  .bm-timer-val { margin-left: 10px; color: #fff; font-family: 'Stratum2 Regular Monodigit', 'Stratum2 Mono'; }
  .bm-min { font-size: 14px; color: #9a9a9a; }
  .bm-body { display: flex; align-items: flex-start; background: rgba(26,26,26,0.78); padding: 10px 4px 14px; }
  .bm-col { padding: 0 10px; border-left: 1px solid rgba(255,255,255,0.045); }
  .bm-col:first-child { border-left: 0; }
  .cc-equipment, .cc-secondary, .cc-grenade { width: 18%; }
  .cc-smg { width: 22%; }
  .cc-rifle { width: 24%; }
  .bm-col-head { display: flex; align-items: baseline; gap: 9px; height: 30px; margin-bottom: 6px; }
  .bm-key { font-family: 'Stratum2 Mono'; font-size: 13px; color: #8a8a8a; }
  .bm-col-title { font-family: 'stratum2 condensed', 'Stratum2'; font-size: 22px; color: #e4e4e4; }
  .bm-col.sel .bm-key, .bm-col.sel .bm-col-title { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.45); }
  .bm-item { position: relative; display: block; width: 100%; height: 72px; margin-bottom: 6px; padding: 4px 10px;
    border: 1px solid rgba(0,0,0,0.65); border-radius: 5px; color: #fff; cursor: pointer; text-align: left;
    background: radial-gradient(circle at 50% 50%, rgba(141,141,141,0.22) 0%, rgba(85,85,85,0.22) 100%);
    transition: filter 0.12s; }
  .bm-item:hover { filter: brightness(2.0); }
  .bm-item-key { position: absolute; left: 8px; top: 5px; font-family: 'Stratum2 Mono'; font-size: 12px; color: #9a9a9a; }
  .bm-item-name { position: absolute; right: 10px; top: 5px; max-width: 78%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-family: 'stratum2 condensed', 'Stratum2'; font-size: 16px; color: #e6e6e6; text-align: right; }
  .bm-icon { position: absolute; left: 12px; right: 12px; top: 25px; height: 30px; display: block;
    background: var(--tint, #fff); -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  .bm-price { position: absolute; right: 10px; bottom: 5px; font-family: 'Stratum2 Regular Monodigit', 'Stratum2 Mono'; font-size: 14px; color: #fff; }
  .bm-item.cant { background: rgba(43,43,43,0.9); }
  .bm-item.cant .bm-icon { background: #474747; }
  .bm-item.cant .bm-price, .bm-item.cant .bm-item-name { color: #808080; }
  .bm-item.own { border-color: rgba(255,255,255,0.85); }
  /* THE DROPPED-WEAPONS PANEL, the way CS2 draws it: a separate box a little
     below the buy grid and as wide as it, dark, with a big, LEGIBLE "Dropped
     Weapons" title across its middle while nothing lies nearby (CS2's is light
     grey, thin, letter-spaced -- ours used to be 10% white, which nobody could
     read), and buy-style tiles inside it when guns do. The box keeps its
     height either way, so the menu never jumps; and its empty state is `bare`,
     because the stylesheet's generic .empty (inventory lists) adds a 60px top
     margin and 0.6 opacity -- that rule matching this box was the extra gap
     and the dimming the user saw. */
  .bm-ground { position: relative; margin-top: 8px; min-width: 0; min-height: 150px; box-sizing: border-box; padding: 10px 14px;
    background: rgba(26,26,26,0.78); }
  .bm-ground-title { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
    font-family: 'Stratum2 Thin', 'Stratum2'; font-size: 44px; letter-spacing: 6px; color: rgba(255,255,255,0.42);
    white-space: nowrap; overflow: hidden; }
  .bm-ground:not(.bare) .bm-ground-title { display: none; }
  .bm-ground-list { position: relative; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; }
  /* a dropped gun is a tile like the buy tiles: count top-left, name top-right, icon across the middle */
  .bm-ground-entry { position: relative; display: block; width: 150px; height: 72px; padding: 4px 10px; border-radius: 5px; cursor: pointer;
    border: 1px solid rgba(0,0,0,0.65); color: #fff; text-align: left; font: inherit;
    background: radial-gradient(circle at 50% 50%, rgba(141,141,141,0.22) 0%, rgba(85,85,85,0.22) 100%); transition: filter 0.12s; }
  .bm-ground-entry:hover { filter: brightness(2.0); }
  .bm-ground-entry .bm-icon { position: absolute; left: 12px; right: 12px; top: 25px; height: 30px; width: auto; }
  .bm-ground-name { position: absolute; right: 10px; top: 5px; max-width: 78%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-family: 'stratum2 condensed', 'Stratum2'; font-size: 16px; color: #e6e6e6; }
  .bm-ground-count { position: absolute; left: 8px; top: 5px; font-family: 'Stratum2 Mono'; font-size: 12px; color: #9a9a9a; }
  /* the close button at the top right of the block (Esc does the same) */
  .bm-close { margin-left: 12px; width: 34px; height: 30px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.28); border-radius: 3px; background: rgba(255,255,255,0.07); color: #e0e0e0;
    font: inherit; font-size: 17px; line-height: 1; cursor: pointer; }
  .bm-close:hover { background: rgba(255,255,255,0.2); color: #fff; }
  /* with the 3D agent up the frame itself is dimmed behind him (main.js
     _buyDim), so the DOM backdrop would only dim the agent a second time */
  #buymenu.dim3d { background: transparent; }
  /* well clear of the bottom HUD (health, emblem, ammo): the row used to sit
     at 64px and printed straight over the emblem and the health figure */
  .bm-nav { position: absolute; left: 0; right: 0; bottom: calc(104px + 22px * var(--bms, 1)); display: flex; justify-content: center; align-items: center; gap: 28px;
    font-family: 'Stratum2 Bold TF', 'Stratum2'; font-size: calc(13px * var(--bms, 1)); letter-spacing: 0.5px; color: #c8c8c8; }
  .bm-nav button { background: transparent; border: 0; color: #c8c8c8; cursor: pointer; font: inherit; letter-spacing: inherit; }
  .bm-nav button:hover { color: #fff; }
  #hud.inmenu #buymenu { display: none !important; }

  /* ============ loadout tab (CS2's loadout_grid, made obvious) ============
     Big slot cards that say CHANGE when hovered, a centred chooser window with
     large tiles, one click picks and closes, a toast confirms. The page is
     dimmed so the lobby character does not sit behind the icons. */
  #tab-loadout { overflow-y: auto; background: rgba(5,7,10,0.74); }
  /* BIGGER, BY REQUEST: the grid scales with the viewport height the way the
     buy menu does (--los, set by hud.js renderLoadout: 1 at 1080p, up to 1.4)
     on top of larger cards and text; the page scrolls, so nothing is lost. */
  /* NO SECOND ZOOM HERE. This page used to scale itself off innerHeight/1080
     (--los, hud.js renderLoadout) back when the menu around it was fixed px.
     The menu now scales as a whole (#menu zoom: var(--ms)), so keeping this
     multiplied the two together -- the columns grew past the window and the
     fifth row of every column ran off the bottom. One scale for everything. */
  #lo-body { position: relative; padding-bottom: 14px; }
  #lo-intro { text-align: center; font-size: 15px; color: #c9d3db; margin: 2px auto 8px; max-width: 880px; line-height: 1.38; }
  #lo-intro b { color: #fff; }
  #lo-teams { display: flex; justify-content: center; gap: 10px; margin: 0 0 10px; }
  #lo-teams button { background: rgba(255,255,255,0.05); color: #cfd8de; border: 1px solid rgba(255,255,255,0.12); padding: 9px 26px;
    border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
  #lo-teams button.ct.sel { background: rgba(125,184,240,0.18); border-color: #7db8f0; color: #fff; }
  #lo-teams button.t.sel { background: rgba(234,190,84,0.18); border-color: #eabe54; color: #fff; }
  #lo-teams button:not(.sel):hover { background: rgba(255,255,255,0.11); }
  #lo-grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 18px; }
  .lo-col { width: 250px; }
  .lo-col.fixed { opacity: 0.8; }
  .lo-title { font-family: 'stratum2 condensed', 'Stratum2'; font-size: 20px; letter-spacing: 1px; text-transform: uppercase; color: #a9bccc; margin: 6px 0 6px; display: flex; align-items: baseline; gap: 8px; }

  /* the chooser */

  .lo-modal-card { width: min(1100px, 92vw); max-height: 84vh; display: flex; flex-direction: column; background: #12171c; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .lo-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .lo-modal-title { font-size: 20px; font-weight: 800; letter-spacing: 2px; }
  .lo-modal-sub { font-size: 13.5px; color: #a9bccc; margin-top: 3px; }
  .lo-modal-close { background: rgba(255,255,255,0.08); color: #fff; border: 0; width: 34px; height: 34px; border-radius: 6px; cursor: pointer; font-size: 15px; }
  .lo-modal-close:hover { background: rgba(255,255,255,0.18); }
  .lo-pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding: 14px 18px; overflow-y: auto; }
  /* a <button> centres its content vertically; the name and blurb must sit at the top, over the art */
  .lo-opt { position: relative; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; height: 150px; padding: 8px 12px; text-align: left; border: 1px solid rgba(255,255,255,0.10); border-radius: 6px; color: #fff; cursor: pointer;
    background: radial-gradient(circle at 50% 50%, rgba(141,141,141,0.22) 0%, rgba(85,85,85,0.22) 100%); transition: filter 0.12s, border-color 0.12s; }

  .lo-opt.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  /* already in another slot: clearly greyed, so it reads as "taken" at a glance

  .lo-opt.used:hover { opacity: 0.65; filter: grayscale(0.5) brightness(1.3); }

  /* ============ pause ============ */
  /* No screen dim. This used to paint rgba(8,11,14,0.78) over everything,
     which is most of a stop on the whole frame -- the map went almost black
     behind the panel. The panel has its own solid background, so it stays
     perfectly readable without darkening the game behind it. */
  #pause { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: transparent; pointer-events: auto !important; }
  /* --panel-solid, not --panel: the translucent one was tuned to sit on top of
     the full-screen dim above, and without that dim the map showed straight
     through the buttons. The panel carries its own contrast now. */
  #pause .panel { background: var(--panel-solid); border-radius: 8px; padding: 32px 42px;
    border: 1px solid rgba(255,255,255,0.07); min-width: 470px; }
  /* Pause neither dims nor blurs the game. There used to be two blurs to pick
     between here -- a CSS backdrop-filter on medium/low, and postfx.js's
     PauseBlurShader inside the render pipeline on High, because a fullscreen
     backdrop-filter re-blurs the WebGL canvas every compositor frame (~9
     dropped frames/sec at 1440p). Neither runs now, so the switch is gone. */
  #pause h2 { font-size: 24px; letter-spacing: 4px; margin-bottom: 20px; text-align: center; }
  .mbtn { display: block; width: 100%; margin-bottom: 9px; background: rgba(255,255,255,0.06); color: #e8eef2;
    border: 1px solid rgba(255,255,255,0.1); padding: 13px; border-radius: 4px; cursor: pointer; font-size: 14px;
    letter-spacing: 1px; }
  .mbtn:hover { background: var(--accent-dim); border-color: var(--accent); }
  .key { background: rgba(255,255,255,0.12); border-radius: 3px; padding: 2px 7px; font-size: 11px; }
  .hint { margin-top: 14px; font-size: 11.5px; opacity: 0.45; text-align: center; line-height: 1.7; }
  /* HOW TO PLAY: the pause overlay's second panel (hud.js openHowTo), and the
     same pages under KEY BINDINGS in the home menu's Settings (.settings-howto).
     The pause panel is wider than the button column, and only its TEXT scrolls,
     so the tabs and BACK stay on screen however short the window is. */
  #pause .phowto { display: none; flex-direction: column; width: min(660px, 94vw); min-width: 0;
    max-height: calc(100% - 32px); padding: 26px 30px; }
  #pause .phowto h2 { margin-bottom: 14px; }
  .qrow.htabs { margin-bottom: 14px; }
  .qrow.htabs button { padding: 9px 6px; font-size: 12px; letter-spacing: 1px; cursor: pointer; }
  #pause .htbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding-right: 8px; margin-bottom: 14px; }
  .htbody { font-size: 13.5px; line-height: 1.55; color: #cfd8de; text-align: left; }
  .htbody h3 { font-size: 12px; letter-spacing: 2px; color: var(--accent); margin: 16px 0 6px; }
  .htbody h3:first-child { margin-top: 0; }
  .htbody p { margin: 0 0 8px; }
  .htbody ul { margin: 0 0 8px; padding-left: 18px; }
  .htbody li { margin-bottom: 5px; }
  .htbody b.ct { color: var(--ct); }
  .htbody b.t { color: var(--t); }
  .htrow { display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
    padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .htrow > span:last-child { text-align: right; }
  .htrow .key { white-space: nowrap; }
  .htnote { font-size: 12px; opacity: 0.6; margin-top: 12px; }
  #pause .htfoot { display: flex; gap: 10px; }
  #pause .htfoot .mbtn { margin-bottom: 0; }
  /* the home menu's copy only: in game the pause menu has its own HOW TO PLAY */
  #menu.pausemode .settings-howto { display: none; }
  /* CHANGE KEYBINDS lands on the list: a short accent pulse shows where to click */
  @keyframes bindflash { 0%, 100% { box-shadow: 0 0 0 0 rgba(139,197,63,0); } 30% { box-shadow: 0 0 0 3px var(--accent); } }
  #bindlist.bindflash { animation: bindflash 1.2s ease-in-out 2; border-radius: 6px; }

  /* ============ main menu (deadshot style) ============ */
  /* ONE SCALE FOR THE WHOLE MENU (hud.js _syncMenuScale sets --ms from the
     window against a 1200x860 design size). inset: 0 still fills the viewport
     under zoom -- percentages resolve in the zoomed space -- so nothing here
     needs compensating. */
  #menu { position: absolute; inset: 0; display: none; pointer-events: auto !important;
    zoom: var(--ms, 1);
    background: linear-gradient(180deg, rgba(5,7,10,0.45) 0%, rgba(5,7,10,0.2) 30%, rgba(5,7,10,0.35) 100%); }
  #topnav { position: absolute; top: 0; left: 0; right: 0; height: 92px; display: flex; align-items: flex-start;
    justify-content: space-between; padding: 14px 26px 0; background: linear-gradient(180deg, rgba(5,7,10,0.85), rgba(5,7,10,0.35) 80%, transparent); }
  .nav-side { width: 220px; padding-top: 10px; }
  .nav-side.right { text-align: right; display: flex; gap: 16px; justify-content: flex-end; align-items: center; }
  #fsbtn { display: inline-block; margin-top: 5px; padding: 3px 10px; font-size: 10.5px;
    letter-spacing: 1.1px; font-weight: 700; color: #cfd8de; cursor: pointer;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 4px; transition: background .14s, color .14s; }
  #fsbtn:hover { background: rgba(255,255,255,0.16); color: #fff; }
  /* FULLSCREEN sits UNDER NEWS (a block, so it takes its own line) and only on
     the home menu: in a match RESUME takes full screen back by itself, and the
     pause menu's shorter top bar has no room for a second row. hud.js hides it
     while the page is already full screen. */
  /* Lowered this far it hangs a few px below the 92px top bar, where the tab
     page (a later sibling, so painted on top) would swallow clicks on its
     bottom edge -- lift the button above the page. The overlays are z 60+. */
  /* 13, not 16: NEWS grew 3px taller, and the user wanted this button left
     exactly where it was on screen before that. */
  #fsbtn { display: flex; align-items: center; gap: 6px; margin-top: 13px;
    position: relative; z-index: 2; }
  /* the four-corner full-screen mark, drawn in the text's own colour so it
     follows the hover (no emoji in this interface). SHORT ARMS, BUTT CAPS: the
     first drawing had arms 3.5 of a 10-unit side with square caps, which add
     half a stroke to every end -- at this size the gaps closed and it read as
     a plain square. Here the gap (5) is wider than an arm (3.5). */
  #fsbtn svg { width: 12px; height: 12px; flex: none; fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: butt; }
  #menu.pausemode #fsbtn { display: none !important; }
  #navcenter { text-align: center; }
  #logo { font-size: 40px; font-weight: 900; font-style: italic; letter-spacing: 2px; line-height: 1;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7); }
  #logo span { color: var(--accent); font-size: 24px; }
  #tabs { display: flex; gap: 4px; justify-content: center; margin-top: 8px; }
  #tabs button { background: transparent; color: #cfd8de; border: 0; border-bottom: 3px solid transparent;
    padding: 9px 16px 10px; cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
  #tabs button:hover { color: #fff; }
  #tabs button.sel { color: #fff; border-bottom-color: #fff; background: rgba(255,255,255,0.05); }
  #navname { font-weight: 800; font-size: 16px; }
  .rankchip { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 4px;
    background: linear-gradient(180deg, rgba(139,197,63,0.22), rgba(139,197,63,0.08));
    border: 1px solid rgba(139,197,63,0.45); color: var(--accent);
    font-size: 10.5px; font-weight: 800; letter-spacing: 1px; vertical-align: 2px; }
  .chal-reward i, .case-price i {
    font-style: normal; display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%; vertical-align: -2px;
    background: radial-gradient(circle at 34% 28%, #ffffff, #e2e9f0 34%, #a2b2c2 70%, #74848f);
    color: #414d58; font-size: 10.5px; font-weight: 900; line-height: 1;
    box-shadow: 0 0 7px rgba(210,232,252,0.6), inset 0 -1px 2px rgba(25,35,45,0.45), inset 0 1px 1px rgba(255,255,255,0.8);
  }

  .tabpage { position: absolute; inset: 92px 0 0 0; display: none; }
  .tabpage.sel { display: block; }
  /* the case grid outgrows the window: scroll it (a page-level scrollbar would
     drag the header and tabs with it) */
  #tab-cases { overflow-y: auto; padding-bottom: 40px; }
  /* ...and so does SETTINGS. Fourteen rows plus the key bindings run ~1450px,
     and with no scroller everything past the fold -- the bot options, both
     resets, every key binding -- was simply unreachable in a desktop window
     (the phone query below already made .tabpage scroll; desktop never did).
     The room under the last row is #settingsbox's bottom margin. */
  #tab-settings { overflow-y: auto; }
  /* Same story for the loadout, the tallest page there is: five columns, then
     RESET TO <TEAM> DEFAULT LOADOUT and its buy-menu hint under them. The page
     box is 768 design px whenever the window is height-bound, and the stack
     wanted 837, so the reset button crossed the bottom edge by 15px and the
     hint by 40 -- with no desktop scroll to reach either. Its own scroll for
     the very short windows, and a tighter header (title, intro, team toggle,
     column headings) so it fits without one at the sizes people actually use. */
  #tab-loadout { overflow-y: auto; }
  #tab-loadout .pagetitle { margin-top: 10px; }
  .pagetitle { text-align: center; font-size: 22px; letter-spacing: 4px; margin-top: 18px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7); }

  /* play tab */
  #challenges { position: absolute; left: 0; top: 60px; width: 300px; background: rgba(8,11,14,0.72);
    padding: 18px 20px; border-radius: 0 8px 8px 0; }
  .chal-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .chal-tabs span { background: rgba(255,255,255,0.08); padding: 6px 18px; border-radius: 4px; font-weight: 700;
    font-size: 13px; opacity: 0.6; }
  .chal-tabs span.sel { opacity: 1; background: rgba(255,255,255,0.16); }
  #challenges h3 { font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; }
  .chal { margin-bottom: 14px; }
  .chal-top { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700; margin-bottom: 5px; }
  .chal-bar { height: 7px; background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden; }
  .chal-bar i { display: block; height: 100%; background: #fff; border-radius: 4px; }
  .chal-reward { text-align: right; font-size: 12px; color: var(--money); margin-top: 3px; font-weight: 700; }
  /* 6% put the name down on the agent's head once the lobby body came up
     (LOBBY_LIFT, main.js): 9px between the two on a short window. The % is of
     .tabpage, whose box is a fixed 768 design px whenever the window is
     height-bound, so 4% is the same ~15px lift at every one of those sizes. */
  #charname { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); font-size: 19px;
    font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,0.85); }
  #playbottom { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); width: 460px;
    text-align: center; }
  #quickopts { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .qrow { display: flex; gap: 5px; justify-content: center; }
  .qrow button { flex: 1; background: rgba(10,13,16,0.65); color: #cfd8de; border: 1px solid rgba(255,255,255,0.1);
    padding: 8px 6px; border-radius: 3px; cursor: pointer; font-size: 12.5px; }
  .qrow button:hover { background: rgba(255,255,255,0.14); }
  .qrow button.sel { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  /* a greyed placeholder button (Ranked): not selectable, a click only explains */
  .qrow button.soon, .qrow button.soon:hover { background: rgba(10,13,16,0.4); color: rgba(207,216,222,0.38); border-color: rgba(255,255,255,0.05); cursor: not-allowed; }
  #mode-toast { text-align: center; font-size: 12px; color: var(--accent); height: 0; opacity: 0; overflow: visible; transition: opacity .2s; margin-top: 2px; }
  #mode-toast.show { opacity: 1; height: 16px; }
  #btn-play { width: 100%; background: linear-gradient(180deg, #55aee8, #2f7fc4); color: #fff; font-size: 34px;
    font-weight: 800; border: 0; padding: 14px; border-radius: 4px; cursor: pointer; letter-spacing: 4px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4); box-shadow: 0 4px 18px rgba(60,140,220,0.35); }
  #btn-play:hover { background: linear-gradient(180deg, #66bdf4, #3a8cd2); }
  /* PLAY, WHILE THE MATCH LOADS (hud.js setPlayLoading / setJoinProgress).
     Pressing PLAY starts the characters, the map and the first weapons loading
     with the menu still up, and until the team screen appears nothing on
     screen moved -- the button read as dead. The loading is unchanged; this
     only SHOWS it: the label becomes the stage and the percent, a bar fills
     along the bottom edge, and a sheen keeps travelling across it so the long
     map download (where the number holds still) still reads as work. */
  #btn-play { position: relative; overflow: hidden; }
  #btn-play .pl-stage, #btn-play .pl-bar { display: none; }
  #btn-play.loading { cursor: progress; pointer-events: none; font-size: 22px; letter-spacing: 3px; padding: 12px 14px 20px;
    background: linear-gradient(180deg, #3f7fae, #275f8f); box-shadow: 0 4px 18px rgba(60,140,220,0.2); }
  #btn-play.loading .pl-stage { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; letter-spacing: 2px; opacity: 0.85; }
  #btn-play.loading .pl-bar { display: block; position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: rgba(0,0,0,0.35); }
  #btn-play.loading .pl-bar b { display: block; height: 100%; width: 0%; background: #e9f4ff; transition: width .35s ease-out; }
  #btn-play.loading .pl-bar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 28%; left: -30%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent); animation: plsheen 1.25s linear infinite; }
  @keyframes plsheen { to { left: 102%; } }
  #playsub { display: flex; gap: 8px; margin-top: 8px; }
  .ghostbtn { flex: 1; background: rgba(120,128,136,0.35); color: #d8dee4; border: 0; padding: 10px;
    border-radius: 4px; font-size: 18px; font-weight: 700; opacity: 0.6; }
  #online { margin-top: 12px; font-size: 15px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
  /* THE COMMUNITY CARD, bottom-left (#menufoot below is bottom-right).
     Discord's modern brand colour is Blurple #5865F2 -- NOT the older #7289DA
     it replaced, which is the one most copies of this widget still use. */
  /* THE CARD IS SIZED BY ITS HEADING. "Join the community!!" is ~20 characters
     of 800-weight text, so it needs roughly 10.4x the font size in width -- at
     26px that is ~270px of line, and the card has to stay wider than that plus
     its padding or the heading wraps to two lines. 340px leaves 306px inside. */
  /* HOME SCREEN ONLY. On the loadout it sat on top of the Equipment column --
     that page fills the width with five columns and has no spare bottom-left
     corner. hud.js stamps #menu[data-tab] on every tab switch. */
  #menu:not([data-tab="play"]) #discordcard { display: none; }
  /* 340/26/23 -> 250/19/18, settled over three passes: 20% down read right,
     a second 18% went too far, this is the step back between them. Every part
     moves together (width, padding, heading, button text, gap and the mark)
     so it stays the same card at a different size; changing the text alone
     leaves a large empty box around it. */
  #discordcard { position: absolute; bottom: 14px; left: 20px; width: 250px;
    background: rgba(18,21,26,0.92); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 12px 12px 13px; text-align: center; }
  #discordcard .dc-head { font-size: 19px; font-weight: 800; letter-spacing: 0.2px;
    color: #f2f6f9; margin-bottom: 10px; white-space: nowrap; }
  #discordcard .dc-btn { display: flex; align-items: center; justify-content: center; gap: 9px;
    background: #5865F2; color: #fff; border-radius: 6px; padding: 10px 11px;
    text-decoration: none; font-weight: 800; font-size: 18px; letter-spacing: 1.4px;
    transition: background .14s, transform .14s; }
  #discordcard .dc-btn:hover { background: #4752c4; transform: translateY(-1px); }
  #discordcard .dc-btn svg { width: 27px; height: 21px; flex: 0 0 auto; }
  @media (max-width: 900px) { #discordcard { width: 184px; bottom: 8px; left: 10px; padding: 9px; }
    #discordcard .dc-head { font-size: 14px; margin-bottom: 7px; }
    #discordcard .dc-btn { font-size: 13px; padding: 8px 8px; }
    #discordcard .dc-btn svg { width: 21px; height: 16px; } }
  #menufoot { position: absolute; bottom: 10px; right: 20px; display: flex; gap: 18px; font-size: 13px;
    opacity: 0.6; font-weight: 600; }
  /* Contact is a real link (contact.html, in a new tab so the loaded game stays
     open); it wears the footer's own look rather than the browser's blue. */
  #menufoot a { color: inherit; text-decoration: none; cursor: pointer; }
  #menufoot a:hover { text-decoration: underline; }

  /* cases tab */
  #caselist { display: flex; gap: 18px; justify-content: center; margin-top: 40px; flex-wrap: wrap; padding: 0 40px; }
  .casecard { width: 185px; background: rgba(10,13,16,0.85); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 16px 14px; text-align: center; }
  .case-art { height: 90px; position: relative; margin-bottom: 10px; perspective: 300px; }
  .case-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.25s ease;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
  .casecard:hover .case-img { transform: rotateX(10deg) rotateY(-7deg) scale(1.07); }
  .case-body { position: absolute; left: 22px; right: 22px; bottom: 6px; height: 52px; border-radius: 5px;
    background: linear-gradient(180deg, var(--ct2, var(--ct)) 0%, #14181c 130%); background-color: var(--ct);
    background: linear-gradient(180deg, var(--ct) 0%, #171b20 140%); box-shadow: inset 0 -8px 14px rgba(0,0,0,0.5); }
  .case-lid { position: absolute; left: 14px; right: 14px; bottom: 52px; height: 22px; border-radius: 6px 6px 2px 2px;
    background: linear-gradient(180deg, #3a4048, #22262c); border-bottom: 3px solid #ffd24a; }
  .casecard[data-case] .case-body { background: linear-gradient(180deg, var(--ct), #171b20 140%); }
  .case-name { font-weight: 800; font-size: 14.5px; margin-bottom: 4px; }
  /* the "what's inside" button: a quiet circle in the card's corner until hover */
  .casecard { position: relative; }
  .case-info { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,0.22); background: rgba(10,13,16,0.75);
    color: #cfd8de; font: 700 12px/1 Georgia, serif; cursor: pointer; opacity: 0.5;
    transition: opacity .15s, background .15s; z-index: 2; }
  .casecard:hover .case-info { opacity: 1; }
  .case-info:hover { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  /* the panel itself */
  #caseinfo { display: none; position: fixed; inset: 0; z-index: 60; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: rgba(5,7,9,0.92); }
  /* the panel's CLOSE is a button, not a menu row: .mbtn is display:block
     width:100%, which stretched it the full 860 px of the panel */
  #cinf-close { width: auto; min-width: 150px; display: inline-block; margin: 0; }
  #cinf-body { max-height: 74vh; overflow-y: auto; width: min(860px, 92vw);
    background: rgba(12,15,19,0.96); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px; padding: 20px 22px; }
  .caseinfo h2 { margin: 0 0 2px; font-size: 22px; letter-spacing: 1px; }
  .ci-sub { margin: 0 0 16px; color: #8b969e; font-size: 12.5px; }
  .ci-tier { margin-bottom: 14px; }
  .ci-head { display: flex; justify-content: space-between; align-items: baseline;
    border-left: 3px solid var(--oc, #666); padding-left: 8px; margin-bottom: 6px; }
  .ci-head b { color: var(--oc, #ddd); font-size: 13.5px; letter-spacing: 0.4px; }
  .ci-head span { color: #7d8790; font-size: 11.5px; }
  .ci-items { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 11px; }
  /* EACH ENTRY SHOWS THE SKIN, not just its name: the same rendered picture
     the case reel and the locker draw, so you can see what you are chasing */
  .ci-item { font-size: 11px; color: #c8d0d6; background: rgba(255,255,255,0.04);
    border-left: 2px solid var(--oc, #666); border-radius: 2px; padding: 4px 7px 5px;
    width: 104px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .ci-item img { width: 92px; height: 69px; object-fit: contain; display: block; }
  .ci-item span { text-align: center; line-height: 1.25; }
  /* the chip is clickable end to end; the magnifier is the affordance that
     says so, and it only shows on hover so 650 of them do not fight the art */
  .ci-item { position: relative; cursor: pointer; }
  .ci-view { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px;
    border-radius: 50%; border: 0; background: rgba(8,11,14,0.72); color: #dfe7ec;
    font-size: 11px; line-height: 22px; padding: 0; cursor: pointer; opacity: 0;
    transition: opacity .14s, background .14s; }
  .ci-item:hover .ci-view { opacity: 1; }
  .ci-view:hover { background: rgba(255,255,255,0.2); }
  .ci-item:hover { background: rgba(255,255,255,0.09); }
  .ci-dud { opacity: 0.62; }
  .ci-dud .ci-head b { color: #96a0a8; }
  .case-price { color: var(--money); font-weight: 700; font-size: 14px; margin-bottom: 10px; }
  .case-open { width: 100%; background: linear-gradient(180deg, #98d24a, #78ad2e); border: 0; color: #10230a;
    font-weight: 800; padding: 9px; border-radius: 4px; cursor: pointer; letter-spacing: 2px; }
  .case-open:hover { filter: brightness(1.1); }

  /* case opening overlay */
  #caseopen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(4,6,9,0.96); z-index: 20; gap: 22px; }
  /* THE REEL IS CS2'S OWN. Converted from panorama/styles/popups/
     popup_capability_decodable.vcss (layout popup_capability_decodable.vxml,
     snippet ScrollItem), number for number. Two copies of the same list ride
     over each other, centred in a panel as tall as the screen and 4:3 wide:
       - the OUTER list: 320 x 224 px cards, brightness .5, softened, seen
         through case-opening-outer.svg -- a sheet with a circular hole that
         also fades out toward the panel's left and right edges;
       - the MAGNIFIED list: 360 x 270 px cards at full brightness with a
         1 px #444 border, seen only through case-opening.svg, the circle,
         over a 50 % black disc. That disc is the circle.
     Every card is a radial grey ground; the rarity colour rises through its
     bottom 40 % (Valve's grey gradient, washed by the rarity colour: grey 145
     -> the colour at 57 %); a 12 px rarity bar sits at its foot (white ->
     grey 200 radial, washed: the colour -> 78 % of it); the item render is
     drawn last across the full width, and there is no name. The centre bar
     is 4 x 268 px of Valve's warningColor #b1af2d. Both lists carry the
     bluedots texture at 2 % (baked into bluedots_2pct.png). Panorama lays out
     at 1080p and scales by screen height, so each px here is (Valve's px /
     1080) of the viewport height: --u is one 1080p pixel. hud.js measures the
     cards' pitch off the layout, so these are the only numbers. */
  /* ...divided by the menu's own zoom (#menu is zoomed as a whole, --ms), so
     the sizes come out in SCREEN pixels as Valve's do. */
  #caseopen { --u: calc(100vh / 1080 / var(--ms, 1)); }
  /* No overflow clip on the panel itself: its edges land on fractional
     pixels (centred, zoomed), and a clip there left a one-pixel sliver of
     the outer list's cards unmasked down the panel's left edge -- "a tiny
     line with light". The masks already confine the lists to the panel's
     box, and #caseopen clips at the viewport. */
  #co-open { position: absolute; left: 50%; top: 50%; height: 100%; width: calc(1440 * var(--u));
    translate: -50% -50%; }
  #caseopen { overflow: hidden; }
  /* .popup-decodable-opening.hidden: folded flat and gone. Valve's hidden
     state also paints a white radial, but it sits under opacity 0 and the
     base rule carries no transition, so in CS2 it is never seen -- the reel
     simply appears. A fade of that white on the way IN was "too much flash". */
  #co-open.hidden { opacity: 0; transform: scaleY(0); transition: transform 0.25s ease-in, opacity 0.1s ease-in; }
  .co-list { position: absolute; inset: 0;
    -webkit-mask: url(ui/cases/case-opening-outer.svg) 0 0 / 100% 100% no-repeat;
    mask: url(ui/cases/case-opening-outer.svg) 0 0 / 100% 100% no-repeat;
    background: url(ui/cases/bluedots_2pct.png) 0 0 / calc(360 * var(--u)) calc(360 * var(--u)) repeat; }
  .co-list--mag { -webkit-mask-image: url(ui/cases/case-opening.svg); mask-image: url(ui/cases/case-opening.svg);
    background-color: rgba(0,0,0,0.5); }
  .co-items { position: absolute; left: 0; top: 50%; translate: 0 -50%; display: flex; will-change: transform; }
  .co-tile { position: relative; flex: 0 0 auto; overflow: hidden;
    width: calc(320 * var(--u)); height: calc(224 * var(--u)); margin: 0 calc(10 * var(--u));
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(145,145,145,0.75), rgba(100,100,110,0.75));
    filter: brightness(0.5) blur(1px); }
  .co-tile.mag { width: calc(360 * var(--u)); height: calc(270 * var(--u)); filter: none;
    border: 1px solid rgb(68,68,68); border-radius: 2px; }
  .co-tint { position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
    background: linear-gradient(to top, color-mix(in srgb, var(--rc) 56.9%, #000), rgba(255,255,255,0)); }
  .co-rarity { position: absolute; left: 0; right: 0; bottom: 0; height: calc(12 * var(--u));
    background: radial-gradient(ellipse 50% 120% at 50% 50%, var(--rc), color-mix(in srgb, var(--rc) 78.4%, #000));
    box-shadow: -2px -2px 4px 4px rgba(65,65,65,0.25); }
  .co-tile img { position: absolute; left: 0; top: 50%; width: 100%; height: auto; transform: translateY(-50%); }
  /* the spin itself: the popup sits on a blurred screen (popupbackground="blur")
     and the panel behind the reel is darkened to .4 (popup-inspect-modelpanel_darken_blur) */
  #caseopen.spin { background: rgba(4,6,9,0.55); -webkit-backdrop-filter: blur(10px) brightness(0.4); backdrop-filter: blur(10px) brightness(0.4); }
  #caseopen.spin #co-title { position: absolute; top: calc(44 * var(--u)); left: 0; right: 0; text-align: center; }
  #caseopen.spin #co-wallet { position: absolute; bottom: calc(40 * var(--u)); left: 0; right: 0; text-align: center; }
  /* THE UNLOCK BEAT SHOWS THE CASE ITSELF, so the backdrop has to let the
     canvas through. #caseopen is rgba(4,6,9,0.96) — a wall the 3D crate spins
     behind, mounted and lit and invisible. Same vignette trick .reveal3d uses
     for the won skin: clear in the middle, solid at the edges so the menu
     underneath stays unreadable. Reverts to the solid backdrop the moment the
     reel starts, which is when the crate is swapped out for the spin. */
  #caseopen.prespin { background: radial-gradient(circle at 50% 46%,
      rgba(4,6,9,0.08) 0%, rgba(4,6,9,0.45) 34%, rgba(4,6,9,0.95) 76%); }
  #caseopen.prespin #co-wallet { opacity: 0.85; }
  /* ...AND THE MENU BEHIND IT HAS TO GO. Clearing the backdrop let the canvas
     through, but it also let the case GRID through: the crate turned with
     "Arms Deal Case" and a row of cards showing straight over it. Same fix
     .reveal3d uses for the won skin — hide the tabs and chrome for the beat,
     so the case is alone in the frame. */
  #menu.prespinmode #tab-cases, #menu.prespinmode #tab-locker, #menu.prespinmode #tab-play,
  #menu.prespinmode #topnav, #menu.prespinmode #menufoot,
  #menu.prespinmode #discordcard { visibility: hidden; }
  .co-unlock { display: inline-block; letter-spacing: 3px; animation: copulse 0.95s ease-in-out infinite; }
  @keyframes copulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  #reelmarker { position: absolute; left: 50%; top: 50%; margin-left: calc(-2 * var(--u)); margin-top: calc(-134 * var(--u));
    width: calc(4 * var(--u)); height: calc(268 * var(--u)); background: #b1af2d;
    box-shadow: -2px -2px 4px 4px rgba(65,65,65,0.25); }
  .skintile { position: relative; width: 120px; height: 100%; margin: 0 4px; flex: 0 0 auto; overflow: hidden;
    background: #14181d; border-radius: 4px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; border: 1px solid rgba(255,255,255,0.07); }
  .st-bg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.5; }
  /* A KNIFE ROW OPENS WITH ITS BLADE (hud.js builds it), the same shape as the
     Default tile that opens every other weapon's row. Not a click target --
     there is no bare Bayonet to equip -- so it takes neither the pointer nor
     the hover lift the owned tiles get. */
  .lk-grid .skintile.modelhead { cursor: default; background: #101418; }
  .lk-grid .skintile.modelhead:hover { transform: none; box-shadow: none;
    border-color: rgba(255,255,255,0.07); }
  .lk-grid .skintile.modelhead .st-name { opacity: 0.75; font-weight: 600; }
  .st-icon { position: relative; height: 34px; width: auto; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8)); }
  /* CS2's own item render. Wider and shorter than the silhouette icons because
     that is the shape Valve renders them at (512x384, shipped here at 256x192). */
  .st-art { height: auto; width: 100%; max-height: 62px; object-fit: contain; }
  /* THE ART GETS THE TILE'S WIDTH. `.lk-grid .st-icon` below caps every tile
     image at 38 px tall, which for a 4:3 render is 51 px wide on a 126 px
     card -- "the skin images are too small". The render is the whole point
     of the card, so it takes 58 px of height (77 px wide) and the card grows
     to hold it; the Default silhouettes keep their own size. Three classes
     deep so it outranks the .st-icon rule that follows it. */
  .lk-grid .skintile .st-art { height: 58px; max-height: 58px; margin-top: 10px; }
  /* the item's condition + float, which is half of what identifies it */
  .st-cond { font-size: 9.5px; letter-spacing: 0.4px; opacity: 0.62;
    font-family: var(--num-font); margin-top: 1px; }
  /* StatTrak(TM) -- CS2 marks the item itself, in its orange */
  .st-tag { position: absolute; top: 5px; right: 6px; font-size: 8.5px; font-weight: 800;
    letter-spacing: 0.4px; color: #cf6a32; background: rgba(0,0,0,0.55);
    border: 1px solid rgba(207,106,50,0.5); border-radius: 3px; padding: 1px 3px; }
  .skintile.stattrak .st-name { color: #e08a4e; }
  /* the unbox reveal shows the real art and the item's own line */
  .rv-art { width: min(46vw, 420px); margin: 6px auto 2px; display: block; }
  /* Valve's own render of the finish, shown over the 3D object. This is the
     skin -- the model behind it is painted from a sampled palette and cannot
     show the artwork itself. */
  .in-art { display: block; width: min(52vw, 560px); margin: 0 auto 4px;
    filter: drop-shadow(0 8px 26px rgba(0,0,0,0.85)); }
  .rv-sub, .in-sub { font-size: 11.5px; opacity: 0.7; letter-spacing: 0.4px;
    font-family: var(--num-font); margin-top: 3px; }
  /* Side-gear tiles (knife / gloves) draw CS2's vector MASKED so it can take a
     team colour -- same mechanism as .buyicon and #casebtn .caseico.
     THE BOX HAS TO BE WIDE, NOT SQUARE. `.st-icon` next door is an <img> at
     `height: 38px; width: auto`, so it sizes by HEIGHT and lets the aspect
     ratio set the width -- an AK lands at 105x38. A mask has no intrinsic
     size, so a square box plus `contain` fits by the SHORT side instead: the
     knife is 76.8x32 in its own viewBox, so 38x38 rendered it 38x16, a third
     the size of every weapon beside it. Gloves are square (32x32) and looked
     right, which is exactly why it went unnoticed. Give it a box wider than
     any icon can need at this height (the widest is the AK at 2.77:1 -> 105px)
     and `contain` then fits by height, matching the <img> exactly. */
  .st-glove, .st-sideicon { position: relative; width: 100px; height: 34px; display: block;
    background: var(--tint, #fff);
    -webkit-mask: var(--icon) center / contain no-repeat;
    mask: var(--icon) center / contain no-repeat; }
  .lk-grid .st-glove, .lk-grid .st-sideicon { width: 112px; height: 38px; }
  .st-name { position: relative; font-size: 10.5px; font-weight: 700; text-align: center; padding: 4px 6px 8px;
    text-shadow: 0 1px 3px #000; line-height: 1.25; }
  .st-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--rc); }
  #revealcard { position: relative; display: none; flex-direction: column; align-items: center; gap: 6px;
    background: #14181d; border: 2px solid var(--rc); border-radius: 10px; padding: 20px 40px;
    box-shadow: 0 0 40px color-mix(in srgb, var(--rc) 50%, transparent); }
  #rv-bg { width: 130px; height: 130px; border-radius: 8px; opacity: 0.9; }
  .rv-icon { height: 52px; margin-top: -95px; margin-bottom: 40px; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.9)); }
  .rv-glove { font-size: 50px; margin-top: -105px; margin-bottom: 46px; }
  .rv-name { font-size: 19px; font-weight: 800; }
  .rv-rarity { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .rv-equip { font-size: 11.5px; opacity: 0.6; }
  #co-btns { display: none; gap: 12px; }
  #co-close, #co-again { width: 220px; }
  #co-again:disabled { opacity: 0.4; cursor: default; }
  #co-wallet { font-size: clamp(12.5px, 1vw, 16px); letter-spacing: 1px; opacity: 0.8; margin: 10px 0 4px; }
  #co-wallet b { color: var(--accent); font-size: clamp(14px, 1.1vw, 18px); }
  #co-wallet i, #co-again i { font-style: normal; opacity: 0.7; }
  /* 3D reveal: pin the wallet strip + buttons to the bottom edge so the
     opened weapon owns the middle of the screen (CS2 reveal framing) */
  /* (the reveal's wallet and buttons sit in the CS2 button row now: #co-btns
     takes .cs2ins-bottom at the reveal and #co-wallet moves inside it) */

  /* inventory tab — CS2-style flowing grid per category */
  .lk-cat { margin-bottom: 26px; }
  .lk-cat > h3 { font-size: 13px; letter-spacing: 3px; color: var(--accent); opacity: 0.9;
    border-bottom: 1px solid rgba(139,197,63,0.25); padding-bottom: 6px; margin-bottom: 12px; }
  #lockerlist { max-width: 1240px; margin: 26px auto 0; padding: 0 30px; overflow-y: auto; max-height: calc(100% - 90px); }
  /* each weapon is its own little panel inside the category — tiles of the
     same gun sit together, guns sit apart ("too clustered" fix) */
  .lk-grid { display: flex; flex-wrap: wrap; gap: 18px 20px; }
  .lk-wep { display: flex; gap: 7px; padding: 8px; background: rgba(255,255,255,0.028);
    border: 1px solid rgba(255,255,255,0.055); border-radius: 7px; }
  .lk-grid .skintile { width: 126px; height: 132px; margin: 0; cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s; }
  .lk-grid .skintile:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0,0,0,0.45);
    border-color: #fff; }
  .lk-grid .skintile.equipped { border: 2px solid var(--accent); box-shadow: 0 0 12px rgba(139,197,63,0.4); }
  .st-wep { position: absolute; top: 0; left: 0; right: 0; padding: 4px 6px 10px; font-size: 9.5px;
    font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; opacity: 0.75; text-align: left;
    background: linear-gradient(rgba(0,0,0,0.55), transparent); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; z-index: 1; pointer-events: none; }
  .lk-grid .st-icon { height: 38px; margin-top: 8px; }
  .lk-grid .skintile.gear .st-icon { height: 42px; }
  .lk-grid .skintile.gear .st-name { opacity: 0.55; font-weight: 600; }
  .empty { text-align: center; opacity: 0.6; margin-top: 60px; line-height: 2; font-size: 15px; }

  /* settings tab */
  #settingsbox { max-width: 520px; margin: 30px auto 40px; background: rgba(10,13,16,0.8); padding: 26px 30px;
    border-radius: 8px; border: 1px solid rgba(255,255,255,0.07); }
  /* In game the page opens from the pause menu, and #pause-back is fixed over its
     bottom edge (26px up, ~40px tall): leave room to scroll the last row clear of
     it. Phones set their own margin in the query below. */
  #menu.pausemode #settingsbox { margin-bottom: 90px; }
  .srow { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .srow label { width: 120px; font-size: 11px; letter-spacing: 1.5px; opacity: 0.6; }
  .srow input[type=range] { flex: 1; accent-color: var(--accent); }
  .srow span { width: 44px; font-size: 13px; }
  /* the FPS readout doubles as a text field -- click it and type a number */
  #fps-val, .numval { width: 74px; cursor: text; padding: 2px 5px; border-radius: 3px;
             border: 1px solid transparent; outline: none; }
  #fps-val:hover, .numval:hover { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.05); }
  #fps-val:focus, .numval:focus { border-color: var(--accent); background: rgba(255,255,255,0.09); }
  .srow input[type=text], #opt-name { flex: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 9px 12px; border-radius: 4px; font-size: 14px; }
  .srow .qrow { flex: 1; }
  /* bot count and bot skill mean nothing with the bots switched off */
  #menu.nobots .srow.botdep { opacity: 0.35; pointer-events: none; }
  /* no text selection anywhere (kills the iOS tap-loupe); inputs stay editable */
  html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: auto; user-select: auto; }
  .tbtn svg { width: 52%; height: 52%; pointer-events: none; display: block; }

  /* cases shortcut under the radar */
  /* Sits BELOW the radar, derived from the dial rather than pinned: the radar
     is --rd-inset from the corner and 250px tall at Valve's 1080p reference,
     both scaled by --cs2-ui-scale, so a fixed `top: 200px` fell inside it as
     soon as the dial took CS2's real size. 12px of clearance under the rim. */
  /* THE CASE BUTTON WEARS A FADE. The three stops and their positions are the
     game's own Fade finish, not a hand-picked gradient: PAINTERS.fade in
     skins.js lays c1/c2/c3 down at 0 / 0.55 / 1, and these are the stops the
     Fade skins in SKINS use (`knife_fade`, `gloves_fade`) -- yellow into
     magenta into violet. So the button is painted by the same recipe that

  #casebtn { position: absolute; left: 16px; z-index: 6;

      linear-gradient(135deg, #f8d838 0%, #e848a8 55%, #4838e8 100%);

    /* FULL COLOUR AT ANY BALANCE. This used to drop to saturate(0.5)
       brightness(0.82) below 250 coins, the price of one case, and only
       return to full paint once you could afford one. It was the only chip
       on the HUD with a washed-out state and nothing on screen explained
       it, so it read as a broken or disabled button rather than as a price
       signal. The wallet no longer changes how the button is painted; the
       only thing left that marks an affordable case is the glow `.afford`

    filter: none;

  // Resolve captured asset URLs to the hashed local files in this checkout.

    const largeLocal = ['/models/oasis.glb', '/z/models/oasis_mobile.glb'];

    const manifestReady = fetch0('./runtime-manifest.json').then(response => response.json()).then(entries => {

        const entryUrl = new URL(entry.url, location.href);
        const local = '/csgo/' + entry.file.slice('runtime\\'.length).replaceAll('\\', '/');
        map.set(entryUrl.pathname + entryUrl.search, local);
      }

    window.__csgoAssetMapReady = manifestReady;
    const rewrite = value => {
      try {
        const u = new URL(String(value), location.href);
        if (isLocalDev && u.hostname === 'assets.clutcher.io') {
          const localAssetMap = window.__csgoAssetMap && window.__csgoAssetMap.get(u.pathname + u.search);
          return localAssetMap || localAssetPrefix + u.pathname + u.search;
        }
        if (isLocalDev && largeLocal.includes(u.pathname)) {
          return localAssetPrefix + u.pathname + u.search;
        }
        if (largeLocal.includes(u.pathname)) return '/__local-large' + u.pathname + u.search;
        return (window.__csgoAssetMap && window.__csgoAssetMap.get(u.pathname + u.search)) || value;
      } catch (_) { return value; }

    manifestReady.then(map => { window.__csgoAssetMap = map; });
    window.fetch = (input, init) => manifestReady.then(() => {
      if (input instanceof Request) input = new Request(rewrite(input.url), input);
      else input = rewrite(input);
      return fetch0(input, init);
    });
    const open0 = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, ...rest) { return open0.call(this, method, rewrite(url), ...rest); };

      const stripBranding = () => {
        const logo = document.getElementById('logo');
        if (logo) logo.textContent = 'CS:GO WEB';
        for (const element of document.querySelectorAll('#sitebadge, .sb-name')) element.textContent = 'CS:GO WEB';
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          if (/clutcher\.io/i.test(node.nodeValue)) node.nodeValue = node.nodeValue.replace(/clutcher\.io/ig, 'CS:GO Web');
        }
      };
      const applyAggressiveLowEndOptimizations = (game, enabled) => {
        if (!game) return;
        if (!enabled && game.__csgoWebAggressiveLowEnd) {
          const state = game.__csgoWebAggressiveLowEnd;
          if (game.renderer) {
            game.renderer.localClippingEnabled = state.localClippingEnabled;
            if (game.renderer.shadowMap) { game.renderer.shadowMap.enabled = state.shadowEnabled; game.renderer.shadowMap.autoUpdate = state.shadowAutoUpdate; }
          }
          for (const [object, castShadow] of state.lights) object.castShadow = castShadow;
          for (const [owner, ownerEnabled] of state.owners) if (owner && 'enabled' in owner) owner.enabled = ownerEnabled;
          game.__csgoWebAggressiveLowEnd = null;
          return;
        }
        if (!enabled || game.__csgoWebAggressiveLowEnd) return;
        const renderer = game.renderer;
        const state = { localClippingEnabled: renderer?.localClippingEnabled, shadowEnabled: renderer?.shadowMap?.enabled, shadowAutoUpdate: renderer?.shadowMap?.autoUpdate, lights: [], owners: [] };
        if (renderer) {
          renderer.setPixelRatio?.(Math.min(window.devicePixelRatio || 1, 0.45));
          renderer.shadowMap && (renderer.shadowMap.enabled = false, renderer.shadowMap.autoUpdate = false);
          renderer.localClippingEnabled = false;
        }
        game.scene?.traverse?.(object => {
          if (object.isLight) { state.lights.push([object, object.castShadow]); object.castShadow = false; }
        });
        for (const owner of [game, game.effects, game.particles, game.particleSystem, game.tracers, game.decals]) {
          if (owner && 'enabled' in owner) { state.owners.push([owner, owner.enabled]); owner.enabled = false; }
          if (owner?.particles && 'enabled' in owner.particles) owner.particles.enabled = false;
        }
        game.__csgoWebAggressiveLowEnd = state;
      };
      const applyLowEndRenderBudget = game => {
        const renderer = game?.renderer;
        if (!renderer || typeof renderer.setPixelRatio !== 'function') return;
        const graphics = window.__csgoWebSettings?.graphics || DEFAULT_SETTINGS.graphics;
        const lowEnd = graphics.lowEndMode !== false;
        applyAggressiveLowEndOptimizations(game, lowEnd);
        if (!game.__csgoWebPerf) {
          game.__csgoWebPerf = { pixelRatio: Math.min(window.devicePixelRatio || 1, lowEnd ? 0.5 : 0.7), ema: 0, sampledAt: 0, adaptive: graphics.adaptive !== false };
          renderer.setPixelRatio(game.__csgoWebPerf.pixelRatio);
          if (renderer.shadowMap) renderer.shadowMap.enabled = !!graphics.shadows;
          document.documentElement.classList.add('csgo-web-lowend');
        }
        const perf = game.__csgoWebPerf;
        perf.adaptive = graphics.adaptive !== false;
        removeVisualDropsAndBodies(game, window.__csgoWebSettings || DEFAULT_SETTINGS);
        if (!perf.adaptive) return;
        const frameMs = Number(game._frameMs) || 0;
        if (!frameMs) return;
        perf.ema = perf.ema ? perf.ema * 0.8 + frameMs * 0.2 : frameMs;
        const now = performance.now();
        if (now - perf.sampledAt < 1000) return;
        perf.sampledAt = now;
        const floor = lowEnd ? 0.35 : 0.45;
        const ceiling = lowEnd ? 0.55 : 0.7;
        const next = perf.ema > 52 ? Math.max(floor, perf.pixelRatio - 0.1) : perf.ema < 28 ? Math.min(ceiling, perf.pixelRatio + 0.05) : perf.pixelRatio;
        if (next !== perf.pixelRatio) {
          perf.pixelRatio = next;
          renderer.setPixelRatio(next);
        }
      };
      const applyPerformanceAndRules = game => {
        if (!game) return;
        if (!game.__csgoWebInitialized) {
          discoverRuntimeCaps(game);
          window.__csgoWebSettings ||= loadSettings();
          applyAllSettings(game);
          game.__csgoWebInitialized = true;
        }
        applyLowEndRenderBudget(game);
        if (game.__csgoWebRules) {
          const rulesNow = performance.now();
          if (rulesNow - (game.__csgoWebRulesSyncAt || 0) < 1000) return;
          game.__csgoWebRulesSyncAt = rulesNow;
          for (const [index, bot] of (game.botMgr?.bots || []).entries()) {
            if (!bot.__csgoWebTeam) {
              bot.__csgoWebTeam = bot.team;
              bot.__csgoWebFfaTeam = `FFA_BOT_${index}`;
              const spawn = bot.spawn;
              bot.spawn = function (...args) {
                const ffaTeam = this.team;
                this.team = this.__csgoWebTeam;
                try { return spawn.apply(this, args); } finally { this.team = ffaTeam; }
              };
            }
            bot.team = bot.__csgoWebFfaTeam;
            const proto = Object.getPrototypeOf(bot);
            if (!proto.__csgoWebFfa) {
              const findTarget = proto.findTarget;
              proto.findTarget = function () {
                const team = this.team;
                this.team = `FFA_${this.name}`;
                try { return findTarget.call(this); } finally { this.team = team; }
              };
              proto.__csgoWebFfa = true;
            }
          }
          game.roundActive = true;
          game.roundTimeLeft = 1e12;
          game.drops.length = 0;
          game.player.money = 999999;
          for (const bot of game.botMgr?.bots || []) bot.money = 999999;
          for (const state of Object.values(game.weapons?.states || {})) state.reserve = 999999;
          for (const bot of game.botMgr?.bots || []) { bot.ammo = 999999; bot.reserve = 999999; }
          return;
        }
        game.__csgoWebRules = true;
        try {
          game.setGfxManual();
          game.setQuality('low');
          game.setRenderScale('performance');
          game.setShadows(false);
          game.fpsCap = 60;
          game.renderer.shadowMap.enabled = false;
          game.postfx?.setBloom?.(false);
          game.postfx?.setAA?.(false);
          // Skip the fullscreen post-processing pass on the low-end profile.
          // The regular renderer remains active, preserving scene/model quality.
          game.postfx = null;
          localStorage.setItem('clutcher_gfxauto', '0');
          localStorage.setItem('clutcher_autotier', 'low');
          localStorage.setItem('clutcher_fpscap', '60');
        } catch (error) { console.warn('performance profile', error); }
        const bots = () => game.botMgr?.bots || [];
        const botProto = bots()[0] && Object.getPrototypeOf(bots()[0]);
        if (botProto && !botProto.__csgoWebFfa) {
          const findTarget = botProto.findTarget;
          botProto.findTarget = function () {
            const team = this.team;
            this.team = `FFA_${this.name}`;
            try { return findTarget.call(this); } finally { this.team = team; }
          };
          botProto.__csgoWebFfa = true;
        }
        if (!game.__csgoWebDamage) {
          const dealDamage = game.dealDamage;
          game.dealDamage = function (victim, amount, attacker, ...rest) {
            if (victim && attacker && victim !== attacker) {
              const vt = victim.team, at = attacker.team;
              victim.team = 'FFA_VICTIM'; attacker.team = 'FFA_ATTACKER';
              try { return dealDamage.call(this, victim, amount, attacker, ...rest); }
              finally { victim.team = vt; attacker.team = at; }
            }
            return dealDamage.call(this, victim, amount, attacker, ...rest);
          };
          game.__csgoWebDamage = true;
        }
        game.spawnDrop = () => null;
        game.clearDrops?.();
        game.drops.length = 0;
        game.endRound = () => { game.roundActive = true; game.roundTimeLeft = 1e12; };
        game.roundActive = true;
        game.roundTimeLeft = 1e12;
        game.player.money = 999999;
        for (const bot of bots()) bot.money = 999999;
        for (const state of Object.values(game.weapons?.states || {})) state.reserve = 999999;
        for (const bot of bots()) { bot.ammo = 999999; bot.reserve = 999999; }
        if (game.hud?.refreshBuyMoney && !game.hud.__csgoWebMoney) {
          const refresh = game.hud.refreshBuyMoney;
          game.hud.refreshBuyMoney = function (...args) { game.player.money = 999999; return refresh.apply(this, args); };
          game.hud.__csgoWebMoney = true;
        }
      };
      const ruleTimer = setInterval(() => {
        applyPerformanceAndRules(window.game);
        buildGraphicsSettings();
        removeUnusedUi();
        removeEconomyAndNewsUi();
        removePauseExtras();
        stripBranding();
      }, 250);
      window.addEventListener('beforeunload', () => clearInterval(ruleTimer), { once: true });
      const pauseOnAlt = event => {
        if (event.code !== 'Alt' || event.repeat || !window.game) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const pause = document.getElementById('pause');
        const visible = pause && getComputedStyle(pause).display !== 'none';
        if (visible) window.game.hud?.hidePause?.();
        else window.game.hud?.showPause?.();
      };
      window.addEventListener('keydown', pauseOnAlt, true);
      (async () => {
        try {
          (await waitFor('Team Deathmatch')).click();
          (await waitFor('Oasis')).click();
          (await waitFor('PLAY')).click();
          const menu = document.getElementById('menu');
          if (menu) menu.classList.add('clutcher-autoboot-hidden');
          await new Promise(resolve => {
            const started = performance.now();
            const poll = () => {
              if (document.body.innerText.includes('CHOOSE YOUR TEAM')) return resolve();
              if (performance.now() - started > 60000) return resolve();
              setTimeout(poll, 100);
            };
            poll();
          });
          const team = document.querySelector('#teamsel .tscard.ct');
          if (team) team.click();
        } catch (error) { console.error(error); }
      })();
    })();
  </script>
</body>
